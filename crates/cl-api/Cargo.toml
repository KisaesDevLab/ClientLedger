[package]
name = "cl-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed client for the local MyBooks engine API (loopback HTTP, sessions, typed errors, safe retries)."

[dependencies]
cl-core = { path = "../cl-core" }
# Plain HTTP to 127.0.0.1 only: no TLS, no system proxy, no HTTP/2, no cookie
# jar (P05 plan §2.2, Q-P05c, Q-P05d).
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` only (not `arbitrary_precision`): report numbers keep their exact
# JSON text without changing number handling anywhere else (S4).
serde_json = { version = "1.0.154", features = ["raw_value"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", default-features = false, features = ["std", "v4"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[features]
# Test-only hooks for the contract harness (raw requests, request observer,
# session token overrides). Never enabled by an app or a non-dev edge (xtask
# guard, P05 plan §2.10, §2.14).
test-support = []

[dev-dependencies]
cl-api = { path = ".", features = ["test-support"] }
cl-host = { path = "../cl-host", features = ["test-support"] }
cl-pg = { path = "../cl-pg" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }
wiremock = "0.6.5"

[lints]
workspace = true

# The contract binaries use their own runner (one engine per binary, ordered
# tests, per-test budgets, deterministic teardown with no orphan processes).
[[test]]
name = "contract"
path = "tests/contract/main.rs"
harness = false

[[test]]
name = "contract_offline"
path = "tests/contract_offline.rs"
harness = false
