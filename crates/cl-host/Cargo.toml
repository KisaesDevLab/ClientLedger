[package]
name = "cl-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cl-pg = { path = "../cl-pg" }
thiserror = "2.0.21"
tracing = "0.1.44"
serde_json = "1.0.149"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
listeners = "0.6.1"

[target.'cfg(windows)'.dependencies]
win32job = "2.0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "process", "user"] }
