[package]
name = "cl-import"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "File readers for imports: list CSV, and bank files (OFX, QFX, QIF, bank CSV) for P25 (Q-11)."

# All MIT OR Apache-2.0 (P25 plan §3).
[dependencies]
cl-core = { path = "../cl-core" }
hmac = "0.13.0"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"

[lints]
workspace = true
