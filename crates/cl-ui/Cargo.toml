[package]
name = "cl-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The ClientLedger egui application: shell, theme, fonts, windows, dialogs."

[dependencies]
cl-api = { path = "../cl-api" }
cl-automation = { path = "../cl-automation" }
cl-company = { path = "../cl-company" }
cl-core = { path = "../cl-core" }
cl-grid = { path = "../cl-grid" }
cl-host = { path = "../cl-host" }
cl-import = { path = "../cl-import" }
cl-model = { path = "../cl-model" }
cl-settings = { path = "../cl-settings" }
# No `default_fonts`: those bundle fonts under licenses outside the cargo-deny
# allowlist. The UI embeds IBM Plex (OFL, ATTRIBUTION.md) instead.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11", "clipboard", "links"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std", "registry"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true

[dev-dependencies]
cl-api = { path = "../cl-api", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[[bench]]
name = "grid_scroll"
harness = false
