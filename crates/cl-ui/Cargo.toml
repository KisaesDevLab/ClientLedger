[package]
name = "cl-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The ClientLedger egui application: shell, theme, fonts, windows, dialogs."

[dependencies]
cl-api = { path = "../cl-api" }
cl-automation = { path = "../cl-automation" }
cl-company = { path = "../cl-company" }
cl-core = { path = "../cl-core" }
cl-grid = { path = "../cl-grid" }
cl-host = { path = "../cl-host" }
cl-import = { path = "../cl-import" }
cl-model = { path = "../cl-model" }
cl-settings = { path = "../cl-settings" }
# No `default_fonts`: those bundle fonts under licenses outside the cargo-deny
# allowlist. The UI embeds IBM Plex (OFL, ATTRIBUTION.md) instead.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11", "clipboard", "links"] }
# P17 document viewer: PNG and JPEG previews (decoded with size limits).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# A02 document viewer: multi-page TIFF (`image` reads page 1 only; Q-A02k).
# MIT. Features: deflate (flate2), CCITT G4 fax (fax), LZW (weezl); all MIT
# or Apache-2.0. No `jpeg`: JPEG-in-TIFF sizes its buffer from the embedded
# JPEG header, past the page-size check (review B1), so such a page is
# unreadable. One page decoded at a time.
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "fax", "lzw"] }
# P17 document viewer: PDF pages through PDFium, loaded at run time from a
# checksum-pinned library (Q-13). MIT OR Apache-2.0. `pdfium_7881` is the
# PDFium API the pinned bblanchon/pdfium-binaries `chromium/7881` build
# offers; no `image` feature (the viewer reads raw RGBA), no V8 or XFA.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
# A01 WP-D (Q-A01m, Q-P13k): native Browse dialogs. MIT. No `gtk3`, so no
# GTK library is linked: on Linux the dialog is the xdg-desktop-portal's,
# reached through the system libdbus-1 loaded at run time (rfd's own FFI),
# with the system `zenity` as rfd's fallback. Windows: IFileDialog
# (windows-sys); macOS: NSOpenPanel (objc2).
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std", "registry"] }
# A01: new intake-folder ids (client UUIDs, U-93). MIT OR Apache-2.0.
uuid = { version = "1.28.0", default-features = false, features = ["std", "v4"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[lints]
workspace = true

[dev-dependencies]
cl-api = { path = "../cl-api", features = ["test-support"] }
# A02: the synthetic CCITT G4 fixture's encoder (the same crate `tiff`
# decodes with). MIT.
fax = "0.2.7"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[[bench]]
name = "grid_scroll"
harness = false
