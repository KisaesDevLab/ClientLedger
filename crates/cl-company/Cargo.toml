[package]
name = "cl-company"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Company lifecycle for ClientLedger: setup interview, open, backup and restore, retention, export all data, delete, the practice company."

[dependencies]
cl-api = { path = "../cl-api" }
cl-core = { path = "../cl-core" }
cl-pg = { path = "../cl-pg" }
cl-settings = { path = "../cl-settings" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# P32: IIF cents rounding (display and file text only; the engine owns
# amounts). MIT.
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
# P32: the transfer passphrase generator (OS random source) and its
# zeroized buffers; both already in the tree (cl-pg). MIT OR Apache-2.0.
getrandom = "0.4.3"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
# Stored (uncompressed) entries only: the engine archive is already
# encrypted, and Export All Data zips CSV text.
zip = { version = "9.0.3", default-features = false }

# `O_NOFOLLOW` and `ELOOP` for reading intake files without following a
# link (A01 security review M2); already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
cl-api = { path = "../cl-api", features = ["test-support"] }
# The practice-company test against the real engine (tests/practice_live.rs).
cl-host = { path = "../cl-host", features = ["test-support"] }
# The golden-report harness (tests/report_golden.rs): options to requests.
cl-model = { path = "../cl-model" }
# A09: builder export goldens are written as the desktop writes the file.
cl-print = { path = "../cl-print" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[lints]
workspace = true
