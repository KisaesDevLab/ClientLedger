[package]
name = "cl-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local preferences for ClientLedger: the recent-companies store, per-company flags kept outside the engine, and keychain-backed secrets."

[dependencies]
cl-core = { path = "../cl-core" }
# P25: random bytes for the bank link key (MIT OR Apache-2.0; already in
# the tree through cl-pg, cl-ui and cl-automation).
getrandom = "0.4.3"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"
# P25: the bank link id in CompanyFlags (MIT OR Apache-2.0; already in cl-core,
# cl-api and cl-ui).
uuid = { version = "1.28.0", default-features = false, features = ["std", "v4", "serde"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[lints]
workspace = true
