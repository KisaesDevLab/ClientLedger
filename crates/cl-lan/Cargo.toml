[package]
name = "cl-lan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "LAN multi-user (P33): the host proxy, the workstation forwarder, pinned mutual TLS, pairing and discovery."

# Licences (P33 plan D1 step 1, M1). Every direct dependency is MIT or
# Apache-2.0 (or offers one of them). `ring` (Apache-2.0 AND ISC) stays
# transitive: it is reached only through rustls's and rcgen's `ring`
# features, never named here.
[dependencies]
cl-core = { path = "../cl-core" }
cl-settings = { path = "../cl-settings" }
cl-api = { path = "../cl-api" }
# Apache-2.0 OR ISC OR MIT. TLS 1.3 only (no `tls12`), ring provider only
# (no aws-lc-rs), no logging feature (no peer data in logs).
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std"] }
# MIT OR Apache-2.0. Without `early-data` (0-RTT stays off, S5).
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
# MIT OR Apache-2.0. Self-signed P-256 certificates for the host and devices.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
# Apache-2.0 OR MIT. mDNS announce/browse on the chosen interface only.
mdns-sd = { version = "0.22.0", default-features = false }
# MIT OR BSD-3-Clause (taken under MIT). The machine's interface addresses.
if-addrs = "0.15.0"
# MIT. HTTP/1.1 only on both hops (no HTTP/2, no pooling).
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
# MIT OR Apache-2.0. The raw request-head check in front of hyper (head.rs).
httparse = "1.10.1"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
bytes = "1.12.1"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
getrandom = "0.4.3"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[features]
# Test-only: lets the host proxy listen on loopback so the soak and the live
# tests drive the real workstation path on one machine (S8, T15). Never
# enabled by an app or a default feature (xtask layering guard).
lan-test-listener = []

[dev-dependencies]
cl-lan = { path = ".", features = ["lan-test-listener"] }
tempfile = "3.27.0"

[lints]
workspace = true
