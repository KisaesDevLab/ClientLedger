[package]
name = "cl-grid"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The ledger grid widget: virtualized two-line rows, inline editors, keyboard and AccessKit (egui)."

[dependencies]
cl-core = { path = "../cl-core" }
cl-model = { path = "../cl-model" }
# Same version as eframe's egui. egui 0.37 has no `accesskit` feature (the
# dependency is unconditional; P10 plan R1), and Cargo unifies features with
# eframe's (`bytemuck`), so none are named here.
egui = { version = "0.37.0", default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
# tests/float_ban.rs proves the clippy.toml bans resolve (N7).
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
