[package]
name = "cl-print"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PDF checks and forms (P19): mm layout specs on US Letter, embedded IBM Plex, exact decimal amounts. Makes bytes only; printing is cl-host::os_print."

[lints]
workspace = true

# All MIT OR Apache-2.0 (rust_decimal: MIT). Already in the tree.
[dependencies]
pdf-writer.workspace = true
# Embedded fonts are subset to the glyphs used (typst's subsetter).
subsetter.workspace = true
# Font metrics (advance widths for right alignment, ascent, cmap).
skrifa.workspace = true
# Logo PNGs are decoded to 8-bit samples (JPEGs pass through as DCTDecode).
png = "0.18.1"
# JPEG logos decoded to pixels for printers that take pixels (Windows
# direct print). MIT OR Apache-2.0 OR Zlib; already in the tree via image.
zune-jpeg = "0.5.15"
flate2 = "1.1.10"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
thiserror = "2.0.21"
# Report exports to Excel (P28, Q-P28f). MIT OR Apache-2.0; its zip tree is
# MIT (cargo deny checked).
rust_xlsxwriter = { version = "0.102.0", default-features = false }
cl-core = { path = "../cl-core" }

[dev-dependencies]
# Reads the exported workbook back (AC3). Already in the tree via rust_xlsxwriter.
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
tempfile = "3"
