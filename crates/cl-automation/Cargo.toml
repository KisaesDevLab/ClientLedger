[package]
name = "cl-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Opt-in control channel: loopback server, control file, tool table, scenario runner. No egui."

[dependencies]
getrandom = "0.4.3"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
