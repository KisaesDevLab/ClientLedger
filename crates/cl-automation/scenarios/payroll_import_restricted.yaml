# Import Payroll (P30, U-247): a viewer with hidden accounts sees the
# window with a reason and can't go on; nothing is uploaded.
name: payroll_import_restricted
description: Restricted viewer - payroll is refused with a reason.
steps:
  - resize: {width: 1440, height: 940}
  - command: payroll.import
  - command: dev.payroll_demo_reset
  - command: dev.payroll_demo_restricted
  - assert_state: {key: screen.allowed, equals: false}
  - assert_state: {key: screen.trouble, equals: restricted}
  - assert_exists: {role: label, label: Payroll is limited to people who can see every account.}
  - command: dev.payroll_demo_file_gusto
  - assert_state: {key: screen.can_next, equals: false}
  - assert_state: {key: screen.uploaded, equals: false}
  - screenshot: restricted
