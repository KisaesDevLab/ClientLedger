# A/R Aging (P28) against `clientledger --demo`: the summary as of today
# (open A/R 48,912.40, the mockup's), its buckets, a client's cell drilling
# to the detail for that client and bucket. Synthetic.
name: reports-aging
description: A/R Aging summary and its drill to the detail.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: reports.ar_aging
  - wait: {ms: 400}
  - assert_state: {key: screen.report, equals: ar_aging_summary}
  - assert_state: {key: screen.state, equals: shown}
  - assert_exists: {label: "48,912.40"}
  - screenshot: ar-aging
  - assert_no_clipping: {}
  - command: reports.collapse
  - screenshot: ar-aging-collapsed
  - command: reports.collapse
