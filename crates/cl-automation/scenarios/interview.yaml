# New Company interview (P08 step 2) against `clientledger --demo`.
name: interview
description: Six interview pages, validation, choices, create.
steps:
  - resize: {width: 1280, height: 820}
  - set_zoom: {percent: 100}
  - command: file.new_company
  - assert_state: {key: screen.screen, equals: new_company}
  - assert_state: {key: screen.page, equals: names}
  - assert_exists: {role: label, label: New company}
  - assert_exists: {role: text_input, label: Business name}
  - assert_exists: {role: text_input, label: Legal name (if different)}

  # Validation: a name is required before moving on.
  - click: {role: button, label: Next}
  - assert_state: {key: screen.page, equals: names}
  - assert_state: {key: screen.issues, equals: 1}
  - assert_exists: {role: label, label: The business needs a name.}

  - click: {role: text_input, label: Business name}
  - type: {text: Shoal Creek Farm}
  - click: {role: text_input, label: Legal name (if different)}
  - type: {text: Shoal Creek Farm LLC}
  - click: {role: radio_button, label: Single-member LLC}
  - screenshot: names
  - click: {role: button, label: Next}
  - assert_state: {key: screen.page, equals: year}
  - assert_exists: {role: radio_button, label: Standard months}
  - click: {role: radio_button, label: 4-4-5 weeks}
  - screenshot: year
  - click: {role: button, label: Next}
  - assert_state: {key: screen.page, equals: chart}
  - click: {role: radio_button, label_contains: Farm / ranch}
  - assert_state: {key: screen.chart, equals: farm}
  - screenshot: chart
  - click: {role: button, label: Next}
  - assert_state: {key: screen.page, equals: features}
  - click: {role: check_box, label: I collect sales tax}
  - assert_state: {key: screen.sales_tax, equals: true}
  - click: {role: text_input, label: Default sales tax rate (%)}
  - type: {text: "8.25"}
  - click: {role: radio_button, label: Cash (when money moves)}
  - screenshot: features
  - click: {role: button, label: Next}
  - assert_state: {key: screen.page, equals: security}
  - assert_exists: {role: radio_button, label: Color 1}
  - click: {role: radio_button, label: Color 3}
  - screenshot: security
  - click: {role: button, label: Next}
  - assert_state: {key: screen.page, equals: review}
  - assert_exists: {role: label, label: Shoal Creek Farm, index: 0}
  - assert_exists: {role: label, label: 4-4-5 weeks, index: 0}
  - screenshot: review

  # Back and forward keep the answers.
  - click: {role: button, label: Back}
  - assert_state: {key: screen.page, equals: security}
  - click: {role: button, label: Next}
  - assert_state: {key: screen.page, equals: review}

  - click: {role: button, label: Create company}
  - assert_state: {key: screen.created, equals: true}
  - assert_state: {key: company_open, equals: true}
  - assert_exists: {role: label, label_contains: Shoal Creek Farm, index: 0}
  - assert_exists: {role: button, label: Show my recovery key}
  - assert_exists: {role: button, label: Enter opening balances}
  - assert_no_clipping: {}
  - screenshot: created
