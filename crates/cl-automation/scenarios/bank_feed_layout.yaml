# Bank Feed fixes from the P26 hands-on QA against `clientledger --demo`:
# 1024 wide and 200% zoom keep every control inside the window (QA-1,
# QA-23); the bulk bar's Change account has its label (QA-3); a Match row
# opens on Match (QA-24); C types an account into a "Needs you" line and A
# records it with the keyboard only (QA-18); Show › Accepted says Accepted
# (QA-8).
name: bank_feed_layout
description: Bank Feed at 1024 wide and 200% zoom, the labelled bulk combo, Match mode, keyboard-only accept, Accepted badges.
steps:
  - resize: {width: 1024, height: 768}
  - set_zoom: {percent: 100}
  - command: banking.import_file
  - command: dev.demo_bank_import_reset
  - command: banking.feed
  - command: dev.demo_feed_reset
  - assert_state: {key: screen.counts.waiting, equals: 37}
  - assert_exists: {role: button, label: Rules}
  # The list scrolls: rows below its fold may cross the window's bottom.
  - assert_no_clipping:
      ignore:
        - {x: 212, y: 680, width: 560, height: 200}
  - screenshot: w1024

  # --- A05 QA-6: a receipt section keeps Accept in the window ------------------
  - command: dev.demo_feed_receipt
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.receipts.read, equals: true, within_ms: 5000}
  - assert_exists: {role: radio_button, label: "Don't use this receipt"}
  - assert_exists: {role: button, label: Accept  A}
  - assert_no_clipping:
      ignore:
        - {x: 212, y: 680, width: 560, height: 200}
  - screenshot: w1024-receipt
  - command: dev.demo_feed_reset
  - assert_state: {key: screen.counts.waiting, equals: 37}

  # --- QA-3: the bulk bar's combo is named --------------------------------------
  - click: {role: button, label: Bank line 1 of 37}
  - key: Space
  - assert_state: {key: screen.selected, equals: 1}
  - assert_exists: {role: combo_box, label: Change account}
  - key: Space

  # --- QA-24: a Match row opens on Match ------------------------------------------
  - click: {role: button, label: Matches 3}
  - click: {role: button, label: Bank line 1 of 3}
  - assert_state: {key: screen.detail.mode, equals: match}

  # --- QA-18: keyboard-only accept of a "Needs you" line ---------------------------
  - click: {role: button, label: Needs review 6}
  - click: {role: button, label: Bank line 1 of 6}
  - key: C
  - assert_state: {key: screen.detail.finding_account, equals: true}
  - type: {text: "bank fees"}
  - key: Enter
  - assert_state: {key: screen.detail.account_chosen, equals: true}
  - assert_state: {key: screen.detail.finding_account, equals: false}
  - screenshot: keyboard-account
  - key: A
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 1}

  # --- QA-8: Show › Accepted says Accepted ---------------------------------------
  - click: {role: combo_box, label: Show}
  - click: {role: button, label: Accepted}
  - assert_state: {key: screen.badges.accepted, equals: 1}
  - assert_state: {key: screen.badges.needs_you, equals: 0}
  - click: {role: combo_box, label: Show}
  - click: {role: button, label: Waiting}

  # --- QA-23: 200% zoom ----------------------------------------------------------
  - resize: {width: 1440, height: 900}
  - set_zoom: {percent: 200}
  - assert_exists: {role: button, label: Rules}
  # The shell's tab strip scrolls by design, and at 200% the window body
  # scrolls: what crosses the bottom edge is below the fold, not cut.
  - assert_no_clipping:
      ignore:
        - {x: -1000, y: 0, width: 20000, height: 140}
        - {x: 0, y: 380, width: 10000, height: 400}
  - screenshot: zoom200
  - resize: {width: 1024, height: 768}
  - screenshot: zoom200-1024

  # --- A05 QA-9: a receipt line at 200% zoom ------------------------------------
  # The toolbars fill most of a 200% window: the list and the panel keep
  # their height below them and the window body scrolls to the panel's
  # Receipt section and Accept; Undo is back at the top.
  - command: dev.demo_feed_reset
  - assert_state: {key: screen.counts.waiting, equals: 37}
  - resize: {width: 1440, height: 940}
  - command: dev.demo_feed_receipt
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.receipts.read, equals: true, within_ms: 5000}
  - scroll: {target: {role: button, label: Rules}, to: end}
  - assert_exists: {role: radio_button, label: "Don't use this receipt"}
  - screenshot: zoom200-receipt
  - click: {role: button, label: Accept  A}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 1}
  - scroll: {target: {role: button, label: Rules}, to: start}
  - screenshot: zoom200-recorded
  - click: {role: button, label: Undo}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 0}
  - resize: {width: 1024, height: 768}
  - command: dev.demo_feed_receipt
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.receipts.read, equals: true, within_ms: 5000}
  - scroll: {target: {role: button, label: Rules}, to: end}
  - screenshot: zoom200-1024-receipt
  - click: {role: button, label: Accept  A}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 1}
  - command: dev.demo_feed_reset
  - set_zoom: {percent: 100}
  - resize: {width: 1440, height: 940}
