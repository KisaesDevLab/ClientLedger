# Memorized Reports (A09 S1/S2, Q-310, Q-A09e/f/k) against
# `clientledger --demo`. The list opens from the Reports menu and shows the
# demo's two reports, one of them Dana's. A new group is made; Dana's report
# can't be renamed (the reason shows for the row), so a copy is memorized,
# renamed with F2 and moved into the group. A builder Profit & Loss exports
# to CSV collapsed and with every line opened (the export run fills every
# opened line). The copy is deleted after a confirm. Synthetic.
name: memorized_reports
description: Memorized Reports list - groups, non-author gating, Memorize a copy, F2 rename, move, builder export, delete.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: reports.memorized_list
  - wait: {ms: 400}
  - assert_state: {key: screen.screen, equals: memorized_reports}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_state: {key: screen.count, equals: 2}
  - assert_exists: {role: text_input, label: Find a report}
  - screenshot: list
  # --- New group ----------------------------------------------------------------
  - click: {role: button, label: New group}
  - assert_state: {key: screen.edit, equals: new_group}
  - click: {role: text_input, label: Group name}
  - type: {text: "For the bank {theme}"}
  - click: {role: button, label: Add group}
  - wait: {ms: 300}
  - assert_state: {key: screen.last_action, equals: group_added}
  - assert_state: {key: screen.groups.0.name, equals: "For the bank {theme}"}
  # --- Someone else's report: gated (Q-310) --------------------------------
  - click: {label_contains: "Balance sheet for the board", index: 0}
  - assert_state: {key: screen.gated, equals: true}
  - assert_disabled: {role: button, label: Rename}
  - assert_disabled: {role: button, label: Move to group}
  - assert_disabled: {role: button, label: Delete}
  - assert_enabled: {role: button, label: Memorize a copy}
  - key: F2
  - assert_state: {key: screen.edit, equals: null}
  - screenshot: gated
  # --- Memorize a copy, rename it (F2), move it into the group -------------
  - click: {role: button, label: Memorize a copy}
  - wait: {ms: 300}
  - assert_state: {key: screen.last_action, equals: copied}
  - assert_state: {key: screen.selected_name, equals: "Balance sheet for the board (copy)"}
  - assert_state: {key: screen.gated, equals: false}
  - key: F2
  - assert_state: {key: screen.edit, equals: rename}
  - key: Ctrl+A
  - type: {text: "Board sheet {theme}"}
  - key: Enter
  - wait: {ms: 300}
  - assert_state: {key: screen.last_action, equals: renamed}
  - assert_state: {key: screen.selected_name, equals: "Board sheet {theme}"}
  - click: {role: button, label: Move to group}
  - assert_state: {key: screen.edit, equals: move}
  - click: {role: combo_box, label: Group}
  - click: {role: button, label: "For the bank {theme}", index: 1}
  - click: {role: button, label: Move}
  - wait: {ms: 300}
  - assert_state: {key: screen.last_action, equals: moved}
  - screenshot: grouped
  # --- A builder report exports every opened line --------------------------
  - command: reports.center
  - wait: {ms: 400}
  - click: {label: Profit & Loss, index: 1}
  - wait: {ms: 400}
  - assert_state: {key: screen.builder.key, equals: profit_loss}
  - assert_state: {key: screen.state, equals: shown}
  - dialog_answer: {paths: ["{scenario_dir}/../../../target/ui-check/memorized_reports/pl-collapsed-{theme}.csv"]}
  - click: {role: button, label: Export CSV}
  - wait: {ms: 800}
  - assert_state: {key: screen.export.ok, equals: true}
  - assert_state: {key: screen.export.filling, equals: false}
  - command: reports.collapse
  - wait: {ms: 600}
  - assert_state: {key: screen.builder.expand_all, equals: true}
  - assert_state: {key: screen.state, equals: shown}
  - dialog_answer: {paths: ["{scenario_dir}/../../../target/ui-check/memorized_reports/pl-open-{theme}.csv"]}
  - click: {role: button, label: Export CSV}
  - wait: {ms: 800}
  - assert_state: {key: screen.export.ok, equals: true}
  - screenshot: exported
  # --- Delete after a confirm -------------------------------------------------
  - command: reports.memorized_list
  - wait: {ms: 400}
  - assert_state: {key: screen.screen, equals: memorized_reports}
  - click: {label_contains: "Board sheet {theme}", index: 0}
  - key: Ctrl+Delete
  - assert_state: {key: screen.edit, equals: delete}
  - screenshot: delete-confirm
  - click: {role: button, label: Delete it}
  - wait: {ms: 300}
  - assert_state: {key: screen.last_action, equals: deleted}
  - assert_not_exists: {label_contains: "Board sheet {theme}"}
