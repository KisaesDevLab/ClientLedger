# Bank Feed matching (P26 DI-2, plan §6 "Two undeposited payments -> one
# deposit", test 25 in part) against `clientledger --demo`. The sample's
# next bank file brings the 11/04 deposit of 2,092.50: the two waiting
# payments (1,250.00 + 842.50) add up exactly, so the detail panel offers
# them as one deposit; Accept posts one demo deposit (Q-P26x) and the Undo
# toast takes it back. Then a match: the 11/02 card line matches the bill
# payment already in the books (nothing posts; Undo would only unlink).
name: bank_feed_matching
description: Two waiting payments become one deposit (and Undo), then a bank line matches an entry in the books.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: banking.import_file
  - command: dev.demo_bank_import_reset
  - command: banking.feed
  - command: dev.demo_feed_reset
  - command: dev.demo_feed_next_file
  - assert_state: {key: screen.counts.waiting, equals: 38}
  - click: {role: button, label: Needs review 7}
  - click: {role: button, label: Bank line 1 of 7}
  - assert_state: {key: screen.detail.mode, equals: deposit}
  - assert_state: {key: screen.detail.groupings, equals: 1}
  - click: {role: radio_button, label_contains: "842.50"}
  - assert_state: {key: screen.detail.picked, equals: 2}
  - assert_state: {key: screen.detail.deposit_balanced, equals: true}
  - screenshot: deposit-grouping
  - click: {role: button, label: Accept  A}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 1}
  - assert_state: {key: screen.toast, equals: 1}
  - screenshot: deposit-toast
  - click: {role: button, label: Undo}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 0}
  - assert_state: {key: screen.counts.waiting, equals: 38}
  - assert_state: {key: screen.notice, equals: bank_feed.notice.undone}

  # --- A bank line matches a bill payment already in the books --------------
  - click: {role: button, label: Matches 3}
  - click: {role: button, label: Bank line 2 of 3}
  - assert_state: {key: screen.detail.mode, equals: match}
  - assert_state: {key: screen.detail.candidates, equals: 1}
  - screenshot: match
  - key: A
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.last_send, equals: match}
  - assert_state: {key: screen.counts.accepted, equals: 1}
  - assert_state: {key: screen.counts.matches, equals: 2}