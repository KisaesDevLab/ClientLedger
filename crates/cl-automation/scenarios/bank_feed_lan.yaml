# Bank Feed when another computer acts first (P26 plan §5 LAN, test 22):
# the demo lets "another computer" accept the next line written; the
# engine answers 409 FEED_ITEM_NOT_PENDING, the line refreshes and leaves
# the selection, and the rest of the selection still records.
name: bank_feed_lan
description: Another computer took a selected line - it refreshes and leaves the selection without a dialog.
steps:
  - resize: {width: 1440, height: 940}
  - command: banking.import_file
  - command: dev.demo_bank_import_reset
  - command: banking.feed
  - command: dev.demo_feed_reset
  - click: {role: button, label: Ready 28}
  - click: {role: button, label: Bank line 1 of 28}
  - key: Space
  - key: J
  - key: Space
  - assert_state: {key: screen.selected, equals: 2}
  - command: dev.demo_feed_conflict
  - key: Ctrl+Enter
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.notice, equals: bank_feed.notice.changed}
  - assert_state: {key: screen.selected, equals: 0}
  - assert_state: {key: screen.counts.accepted, equals: 2}
  - assert_state: {key: screen.counts.ready, equals: 26}
  - screenshot: changed-elsewhere