# Chart of Accounts (P11 step 1) against `clientledger --demo`: Ctrl+A
# opens it; hierarchy and inactive filter; keyboard-only create, edit and
# make inactive / active again; a used number refused; Account Report; Esc
# closes the panel, then the window. The demo chart is synthetic; balances
# are the demo engine's own figures, never added up by the app.
name: chart-of-accounts
description: Hierarchy, filter, keyboard create/edit/inactivate, used number, Account Report, card digits (A03).
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - key: Ctrl+A
  - assert_exists: {role: tab, label: Chart of Accounts}
  - assert_state: {key: screen.screen, equals: chart_of_accounts}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_state: {key: screen.numbers, equals: true}
  - assert_state: {key: screen.merge_available, equals: false}
  - assert_exists: {role: row, label_contains: "1010 Operating Checking"}
  - assert_exists: {label_contains: "a parent's total with its sub-accounts is not available yet"}
  - assert_state: {key: screen.focused, equals: true}
  - assert_no_clipping: {}
  - screenshot: chart
  # Typing in the list jumps to the account; sub-accounts show their path.
  - type: {text: "6721"}
  - assert_exists: {role: row, label_contains: "6721 Vehicle Expenses:Trailer Registration:Plates and Permits"}
  - assert_state: {key: screen.selected_depth, equals: 2}
  - screenshot: sub-accounts
  - assert_not_exists: {role: row, label_contains: "Answering Service"}

  # --- Include inactive (Ctrl+Shift+H), twice --------------------------------
  - key: Ctrl+Shift+H
  - assert_state: {key: screen.show_inactive, equals: true}
  - assert_exists: {role: row, label_contains: "Answering Service, Inactive"}
  - key: Ctrl+Shift+H
  - assert_state: {key: screen.show_inactive, equals: false}

  # --- Keyboard-only create: type, detail, name, number; Alt+S ---------------
  - key: Ctrl+N
  - assert_state: {key: screen.panel, equals: new}
  - assert_exists: {role: label, label: New account}
  - key: Tab
  - key: Tab
  - type: {text: Tolls and Parking}
  - key: Tab
  - type: {text: "1010"}
  - assert_state: {key: screen.dirty, equals: true}
  - key: Alt+S
  # 1010 belongs to Operating Checking: refused in plain words, on the field.
  - assert_state: {key: screen.panel, equals: new}
  - assert_state: {key: screen.problem, equals: number_taken}
  - assert_exists: {label_contains: "already uses this number"}
  - screenshot: number-taken
  - key: Ctrl+A
  - type: {text: "6730"}
  - key: Alt+S
  - assert_state: {key: screen.panel, equals: none}
  - assert_state: {key: screen.note, equals: saved}
  - assert_exists: {role: row, label_contains: "6730 Tolls and Parking"}
  - assert_state: {key: screen.selected_active, equals: true}

  # --- Keyboard-only edit (Ctrl+E), Esc reverts, then closes -----------------
  - key: Ctrl+E
  - assert_state: {key: screen.panel, equals: edit}
  - key: End
  - type: {text: " Fees"}
  - assert_state: {key: screen.dirty, equals: true}
  - key: Escape
  - assert_state: {key: screen.dirty, equals: false}
  - assert_state: {key: screen.panel, equals: edit}
  - key: End
  - type: {text: " Fees"}
  - key: Alt+S
  - assert_state: {key: screen.panel, equals: none}
  - assert_exists: {role: row, label_contains: "6730 Tolls and Parking Fees"}

  # --- Make inactive, then active again (Ctrl+Shift+I) ------------------------
  - key: Ctrl+Shift+I
  - assert_state: {key: screen.note, equals: made_inactive}
  - assert_not_exists: {role: row, label_contains: "6730 Tolls and Parking Fees"}
  - key: Ctrl+Shift+H
  - assert_exists: {role: row, label_contains: "6730 Tolls and Parking Fees, Inactive"}
  - assert_state: {key: screen.selected_active, equals: false}
  - assert_exists: {role: button, label: Make active again}
  - key: Ctrl+Shift+I
  - assert_state: {key: screen.note, equals: made_active}
  - assert_state: {key: screen.selected_active, equals: true}
  - key: Ctrl+Shift+H
  # Clear the number again so the next theme's run can reuse 6730 (the demo
  # chart lives as long as the app).
  - key: Ctrl+E
  - key: Tab
  - key: Ctrl+A
  - key: Backspace
  - key: Alt+S
  - assert_state: {key: screen.panel, equals: none}
  - assert_not_exists: {role: row, label_contains: "6730 Tolls"}

  # --- An account with a balance can't go inactive ----------------------------
  - type: {text: Operating}
  - assert_exists: {role: row, label_contains: "1010 Operating Checking"}
  - key: Ctrl+Shift+I
  - assert_state: {key: screen.warning, equals: cant_deactivate_balance}

  # --- Account Report (Ctrl+Shift+Q) --------------------------------------------
  - assert_exists: {role: button, label_contains: "Account Report"}
  - key: Ctrl+Shift+Q
  - assert_state: {key: screen.panel, equals: report}
  - assert_state: {key: screen.report_loaded, equals: true}
  - assert_exists: {label_contains: "Account Report: 1010"}
  - assert_exists: {label_contains: "Balance in your books"}
  - click: {role: radio_button, label: All dates}
  - assert_state: {key: screen.report_loaded, equals: true}
  - assert_no_clipping: {}
  - screenshot: quick-report
  - key: Escape
  - assert_state: {key: screen.panel, equals: none}

  # --- The bank number field is switched off until the engine keeps it -------
  # A new account takes the selected account's type: a bank account here.
  - key: Ctrl+N
  - assert_exists: {role: check_box, label: Sensitive account}
  - assert_disabled: {role: text_input, label: Bank or card number}
  - assert_exists: {label_contains: "shown masked, is not available yet"}
  - screenshot: new-bank-account
  - key: Escape
  - assert_state: {key: screen.panel, equals: none}

  # --- A03: "Card ends in" on a credit card account ---------------------------
  # The demo engine has no `document-drafts-v1`, so a credit card account
  # shows no card field. 2050 is a liability: a new account starts as one;
  # Tab to the detail type and Down picks Credit card.
  - type: {text: "2050"}
  - assert_exists: {role: row, label_contains: "2050 Business Credit Card"}
  - key: Ctrl+N
  - key: Tab
  - key: ArrowDown
  - assert_state: {key: screen.card_digits_on, equals: false}
  - assert_state: {key: screen.card_field, equals: false}
  - assert_not_exists: {role: text_input, label: Card ends in}
  - screenshot: card-field-hidden
  - key: Escape
  - key: Escape
  - assert_state: {key: screen.panel, equals: none}
  # With it (the demo's stand-in for the capability): keyboard only.
  - command: dev.demo_card_digits
  - assert_state: {key: screen.card_digits_on, equals: true}
  - key: Ctrl+N
  - key: Tab
  - key: ArrowDown
  - assert_state: {key: screen.card_field, equals: true}
  - assert_exists: {role: text_input, label: Card ends in}
  - key: Tab
  - type: {text: "Fuel Card {theme}"}
  - key: Tab
  - key: Tab
  - key: Tab
  - key: Tab
  - key: Tab
  - assert_focused: {role: text_input, label: Card ends in}
  - type: {text: "48a1"}
  - key: Alt+S
  - assert_state: {key: screen.panel, equals: new}
  - assert_state: {key: screen.problem, equals: card_digits}
  - assert_exists: {label_contains: "exactly 4 digits"}
  - assert_focused: {role: text_input, label: Card ends in}
  - key: Ctrl+A
  - type: {text: "4821"}
  - assert_no_clipping: {}
  - hover: {role: text_input, label: Card ends in}
  - wait: {ms: 800}
  - assert_exists: {role: text_input, label: Card ends in, description_contains: "reading receipts"}
  - screenshot: card-field
  - key: Alt+S
  - assert_state: {key: screen.panel, equals: none}
  - assert_state: {key: screen.note, equals: saved}
  - assert_state: {key: screen.selected_card_set, equals: true}
  # Tidy up for the next theme's run: the account goes inactive and the
  # demo engine stops storing card digits again.
  - key: Ctrl+Shift+I
  - assert_state: {key: screen.note, equals: made_inactive}
  - command: dev.demo_card_digits
  - assert_state: {key: screen.card_digits_on, equals: false}
  - key: Escape
  - assert_not_exists: {role: tab, label: Chart of Accounts}
