# Crash recovery (P34 B4, Q-P34o) against `clientledger --demo`: the
# window an unclean start opens (dev.crash_demo_unclean marks it), with the
# journal sentence (the demo says the database replayed it), the secrets
# note, and its actions; Continue closes it. Local only: nothing here asks
# the engine.
name: crash_recovery
description: The unclean-exit window with its journal line, actions and Continue.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: dev.crash_demo_unclean
  - assert_state: {key: screen.screen, equals: crash_recovery}
  - assert_state: {key: screen.unclean, equals: true}
  - assert_state: {key: screen.journal_replayed, equals: true}
  - assert_exists: {label_contains: "didn't close normally"}
  - assert_exists: {label_contains: "replayed its journal"}
  - assert_exists: {role: button, label: Check My Books}
  - assert_exists: {role: button, label: Restore a Company Backup}
  - assert_exists: {role: button, label: Copy Details}
  - assert_not_exists: {role: button, label: Restore a Full Database Backup}
  - assert_no_clipping: {}
  - screenshot: unclean
  - click: {role: button, label: Continue}
  - assert_not_exists: {role: tab, label: Didn't Close Normally}
