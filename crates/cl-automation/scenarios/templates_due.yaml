# Templates Due (P15 plan §6 "templates_catch_up", lane C) against
# `clientledger --demo` (today 11/04/2026, books closed through 09/30/2026,
# closing-date password "demo-close", synthetic): opening the company runs
# the catch-up and shows what it did.
#
# - "Catch-up transfer" (12.34, Enter automatically, monthly from 10/20, 2
#   times): 10/20 is entered for you.
# - "Closed-period transfer" (7.50, Enter automatically, once on 09/25):
#   09/25 is in the closed period, so it couldn't be entered, with the plain
#   reason.
# - "Reminder transfer" (5.00, Remind me, every two weeks from 10/07): 10/07,
#   10/21 and 11/04 wait for you.
#
# Then: Open the entered one; Enter now (10/07); Open in form (10/21, saved
# from the form, so the reminder is done); Skip this one (11/04); Enter it now
# on the closed-period date through the form with the closing-date password;
# Check now finds nothing more. A capped catch-up (more than 31 dates of one
# schedule) can't happen in the demo, whose automatic starts are at most 366
# days back and whose runner asks again until done: its rows (no Skip or
# Dismiss) are covered by the Templates Due unit tests.
#
# Light and dark run in the same app, so the scenario is repeatable: every
# transaction it enters is voided (the closed-period one is deleted in the
# register, with the password again) and the templates are deleted. The first
# open of the practice company also catches up its sample "Accounting
# software" (10/15 entered, 09/15 closed): step 0 opens the company once so
# that happens before the scenario's own templates exist, and dismisses the
# closed 09/15 (only the light run has it). All data is synthetic.
name: templates_due
description: Catch-up on company open - entered, waiting, closed-period skip with the password through the form, Enter now, Open in form, Skip, Check now.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}

  # --- 0. The sample's own catch-up out of the way ------------------------------
  - command: file.open_company
  - click: {role: button, label: Ozark Ridge Landscaping LLC}
  - click: {role: button, label: Open}
  # First run only: the demo's unsaved Write Check asks first.
  - click_if_present: {role: button, label: Discard changes}
  - assert_state: {key: company_open, equals: true}
  - command: lists.templates_due
  - assert_state: {key: screen.screen, equals: templates_due}
  - assert_state: {key: screen.as_of, equals: "2026-11-04"}
  - assert_state: {key: screen.waiting, equals: 0}
  # Light only: the sample's 09/15 in the closed period.
  - click_if_present: {role: button, label: Dismiss}
  - assert_state: {key: screen.skipped, equals: 0}
  - command: file.close_window

  # --- 1. Three templates: automatic 10/20 and 09/25, a reminder from 10/07 ---
  - key: Ctrl+T
  - assert_state: {key: screen.screen, equals: transfer}
  - assert_state: {key: screen.loaded, equals: true}
  - click: {role: button, label: Clear}
  - click: {role: combo_box, label: Transfer to}
  - click: {role: button, label: "1020 · Savings"}
  - type: {text: "12.34", target: {role: text_input, label: Amount}}
  - key: Tab
  - key: Ctrl+M
  - click: {role: text_input, label: Name}
  - key: Ctrl+A
  - type: {text: Catch-up transfer}
  - click: {role: radio_button, label: Enter automatically}
  - click: {role: text_input, label: Next date}
  - key: Ctrl+A
  - type: {text: "10/20/2026"}
  - key: Tab
  - click: {role: radio_button, label: After}
  - click: {role: text_input, label: Ends}
  - type: {text: "2"}
  - assert_state: {key: screen.template.dialog.mode, equals: auto}
  - assert_state: {key: screen.template.dialog.preview, equals: ["2026-10-20", "2026-11-20"]}
  - click: {role: button, label: Save}
  - assert_state: {key: screen.template.saved_count, equals: 1}
  - assert_state: {key: screen.template.error, equals: false}
  # The closed-period one carries a memo of its own, so the register finds
  # its one transaction at the end (cleanup).
  - click: {role: button, label: Clear}
  - click: {role: combo_box, label: Transfer to}
  - click: {role: button, label: "1020 · Savings"}
  - type: {text: "7.50", target: {role: text_input, label: Amount}}
  - key: Tab
  - type: {text: "{theme} closed-period transfer", target: {role: text_input, label: Memo}}
  - key: Ctrl+M
  - click: {role: text_input, label: Name}
  - key: Ctrl+A
  - type: {text: Closed-period transfer}
  - click: {role: radio_button, label: Enter automatically}
  - click: {role: text_input, label: Next date}
  - key: Ctrl+A
  - type: {text: "09/25/2026"}
  - key: Tab
  - click: {role: radio_button, label: After}
  - click: {role: text_input, label: Ends}
  - type: {text: "1"}
  - assert_state: {key: screen.template.dialog.preview, equals: ["2026-09-25"]}
  - click: {role: button, label: Save}
  - assert_state: {key: screen.template.saved_count, equals: 2}
  - assert_state: {key: screen.template.error, equals: false}
  - click: {role: button, label: Clear}
  - click: {role: combo_box, label: Transfer to}
  - click: {role: button, label: "1020 · Savings"}
  - type: {text: "5", target: {role: text_input, label: Amount}}
  - key: Tab
  - key: Ctrl+M
  - click: {role: text_input, label: Name}
  - key: Ctrl+A
  - type: {text: Reminder transfer}
  - click: {role: combo_box, label: How often}
  - click: {role: button, label: Every two weeks}
  - click: {role: text_input, label: Next date}
  - key: Ctrl+A
  - type: {text: "10/07/2026"}
  - key: Tab
  - assert_state: {key: screen.template.dialog.mode, equals: remind}
  - assert_state: {key: screen.template.dialog.frequency, equals: biweekly}
  - click: {role: button, label: Save}
  - assert_state: {key: screen.template.saved_count, equals: 3}
  - click: {role: button, label: Clear}
  - command: file.close_window

  # --- 2. Open the company: the catch-up summary opens -------------------------
  - command: file.open_company
  - click: {role: button, label: Ozark Ridge Landscaping LLC}
  - click: {role: button, label: Open}
  - assert_state: {key: company_open, equals: true}
  - assert_state: {key: screen.screen, equals: templates_due}
  - assert_state: {key: screen.as_of, equals: "2026-11-04"}
  - assert_state: {key: screen.entered, equals: 1}
  - assert_state: {key: screen.waiting, equals: 3}
  - assert_state: {key: screen.skipped, equals: 1}
  # The status-bar chip counts the dates listed (3 waiting + 1 skipped).
  - assert_state: {key: templates_need_you, equals: 4}
  - assert_state: {key: screen.failed, equals: 0}
  - assert_state: {key: screen.rows.0.section, equals: entered}
  - assert_state: {key: screen.rows.0.date, equals: "2026-10-20"}
  - assert_state: {key: screen.rows.1.section, equals: waiting}
  - assert_state: {key: screen.rows.1.date, equals: "2026-10-07"}
  - assert_state: {key: screen.rows.2.date, equals: "2026-10-21"}
  - assert_state: {key: screen.rows.3.date, equals: "2026-11-04"}
  - assert_state: {key: screen.rows.4.section, equals: skipped}
  - assert_state: {key: screen.rows.4.date, equals: "2026-09-25"}
  - assert_state: {key: screen.rows.4.reason, equals: CLOSED_PERIOD}
  - assert_state: {key: screen.rows.4.can_dismiss, equals: true}
  - assert_exists: {role: label, label: Entered for you}
  - assert_exists: {role: label, label: Waiting for you}
  - assert_exists: {role: label, label: "Couldn't be entered"}
  - assert_exists: {role: label, label: "This date is in a closed period. Enter it yourself with the closing password."}
  - assert_exists: {role: label, label: "Scheduled templates as of 11/04/2026."}
  - assert_count: {target: {role: button, label: Skip this one}, count: 3}
  - assert_count: {target: {role: button, label: Enter it now}, count: 1}
  - assert_no_clipping: {}
  - screenshot: summary

  # --- 3. Open the entered one (then void it: cleanup) --------------------------
  - click: {role: button, label: Open}
  - assert_state: {key: screen.screen, equals: transfer}
  - assert_state: {key: screen.mode, equals: edit}
  - assert_state: {key: screen.date, equals: "2026-10-20"}
  - assert_state: {key: screen.amount, equals: "12.34"}
  - command: edit.void_transaction
  - assert_state: {key: screen.void_open, equals: true}
  - type: {text: Scenario cleanup, target: {role: text_input, label: Reason}}
  - click: {role: button, label: Void}
  - assert_state: {key: screen.last_action, equals: void}
  - command: file.close_window
  - command: lists.templates_due
  - assert_state: {key: screen.screen, equals: templates_due}

  # --- 4. Waiting: Enter now (10/07) ----------------------------------------------
  - click: {role: button, label: Enter now, index: 0}
  - assert_state: {key: screen.last_action, equals: enter}
  - assert_state: {key: screen.notice, equals: templates_due.done.entered}
  - assert_state: {key: screen.error, equals: false}
  - assert_state: {key: screen.waiting, equals: 2}
  - assert_state: {key: screen.rows.1.date, equals: "2026-10-21"}
  - screenshot: entered-now
  - click: {role: link, label: Open}
  - assert_state: {key: screen.screen, equals: transfer}
  - assert_state: {key: screen.mode, equals: edit}
  - assert_state: {key: screen.date, equals: "2026-10-07"}
  - assert_state: {key: screen.amount, equals: "5.00"}
  - command: edit.void_transaction
  - type: {text: Scenario cleanup, target: {role: text_input, label: Reason}}
  - click: {role: button, label: Void}
  - assert_state: {key: screen.last_action, equals: void}
  - command: file.close_window
  - command: lists.templates_due

  # --- 5. Waiting: Open in form (10/21), saved from the form --------------------
  - click: {role: button, label: Open in form, index: 0}
  - assert_state: {key: screen.screen, equals: transfer}
  - assert_state: {key: screen.mode, equals: new}
  - assert_state: {key: screen.date, equals: "2026-10-21"}
  - assert_state: {key: screen.amount, equals: "5.00"}
  - assert_state: {key: screen.template.occurrence, equals: "2026-10-21"}
  - screenshot: open-in-form
  - key: Alt+N
  - assert_state: {key: screen.saved_count, equals: 1}
  - assert_state: {key: screen.template.busy, equals: false}
  - assert_state: {key: screen.template.occurrence, equals: null}
  - command: form.prev_record
  - assert_state: {key: screen.mode, equals: edit}
  - assert_state: {key: screen.date, equals: "2026-10-21"}
  - command: edit.void_transaction
  - type: {text: Scenario cleanup, target: {role: text_input, label: Reason}}
  - click: {role: button, label: Void}
  - assert_state: {key: screen.last_action, equals: void}
  - command: file.close_window
  - command: lists.templates_due
  - assert_state: {key: screen.waiting, equals: 1}
  - assert_state: {key: screen.rows.1.date, equals: "2026-11-04"}

  # --- 6. Waiting: Skip this one (11/04) ------------------------------------------
  - click: {role: button, label: Skip this one}
  - assert_state: {key: screen.last_action, equals: skip}
  - assert_state: {key: screen.notice, equals: templates_due.done.skipped}
  - assert_state: {key: screen.waiting, equals: 0}
  - assert_exists: {role: label, label: No reminders are due.}

  # --- 7. Couldn't be entered: Enter it now with the closing-date password -------
  - click: {role: button, label: Enter it now}
  - assert_state: {key: screen.screen, equals: transfer}
  - assert_state: {key: screen.date, equals: "2026-09-25"}
  - assert_state: {key: screen.amount, equals: "7.50"}
  - assert_state: {key: screen.template.occurrence, equals: "2026-09-25"}
  - key: Alt+N
  - assert_state: {key: screen.closing, equals: asking}
  - assert_exists: {role: password_input, label: Closing-date password}
  - assert_exists: {role: label, label_contains: "closing date (09/30/2026)"}
  - screenshot: closing-password
  - click: {role: password_input, label: Closing-date password}
  - type: {text: demo-close}
  - click: {role: button, label: Change}
  - assert_state: {key: screen.closing, equals: done}
  - assert_state: {key: screen.saved_count, equals: 1}
  - assert_state: {key: screen.template.occurrence, equals: null}
  - command: file.close_window
  # Cleanup: delete it in the register (the closed period asks again).
  - key: Ctrl+G
  - assert_state: {key: screen.screen, equals: register}
  - assert_state: {key: screen.loaded, equals: true}
  - key: Ctrl+F
  - assert_state: {key: screen.goto.open, equals: true}
  - type: {text: "{theme} closed-period transfer"}
  - click: {role: button, label: Find Previous}
  - assert_state: {key: screen.goto.last, equals: found}
  - assert_state: {key: screen.goto.jump_pending, equals: false}
  - assert_exists: {role: row, label_contains: "09/25/2026, , "}
  - click: {role: button, label: Close}
  - key: Ctrl+D
  - assert_state: {key: screen.row_action.panel, equals: confirm_delete}
  - click: {role: button, label: Delete}
  - assert_state: {key: screen.row_action.closing, equals: asking}
  - click: {role: password_input, label: Closing-date password}
  - type: {text: demo-close}
  - click: {role: button, label: Change}
  - assert_state: {key: screen.row_action.closing, equals: done}
  - assert_state: {key: screen.row_action.last, equals: delete}
  - assert_state: {key: screen.row_action.error, equals: false}
  - command: file.close_window
  - command: lists.templates_due
  - assert_state: {key: screen.skipped, equals: 0}

  # --- 8. Check now: nothing more is due ------------------------------------------
  - click: {role: button, label: Check now}
  - assert_state: {key: screen.checking, equals: false}
  - assert_state: {key: screen.entered, equals: 0}
  - assert_state: {key: screen.waiting, equals: 0}
  - assert_state: {key: screen.skipped, equals: 0}
  - assert_exists: {role: label, label_contains: "Nothing is due."}
  - assert_no_clipping: {}
  - screenshot: nothing-due
  - command: file.close_window

  # --- 9. Cleanup: delete the three templates ------------------------------------
  - command: lists.templates
  - assert_state: {key: screen.screen, equals: templates}
  - assert_state: {key: screen.loaded, equals: true}
  - click: {role: button, label_contains: "Catch-up transfer"}
  - click: {role: button, label: Delete}
  - click: {role: button, label: Delete, index: 1}
  - assert_state: {key: screen.last_action, equals: delete}
  - click: {role: button, label_contains: "Reminder transfer"}
  - click: {role: button, label: Delete}
  - click: {role: button, label: Delete, index: 1}
  - click: {role: button, label_contains: "Closed-period transfer"}
  - click: {role: button, label: Delete}
  - click: {role: button, label: Delete, index: 1}
  - assert_not_exists: {role: button, label_contains: "transfer"}
  - assert_state: {key: screen.count, equals: 3}
  - command: file.close_window
