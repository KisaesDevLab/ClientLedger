# Company tag options (P29 WP7, Q-276) against `clientledger --demo`: an
# Admin turns on "Require a tag on every line" in Preferences › Tags; Write
# Check then refuses a line without a tag and names it ("Expenses tab,
# line 1"); a tag at the top of the form fills every line; Bulk Entry
# refuses an untagged row by section and row. (A template's Use opens the
# form, whose save is the one checked here.) The option goes off again at the
# end so the dark run starts the same. Synthetic data only.
name: tag_options
description: Tag on every line refuses untagged lines in Write Check, Bulk Entry and the Bank Feed.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}

  # --- Preferences › Tags (Admin) -------------------------------------------
  - command: edit.preferences
  - assert_state: {key: screen.screen, equals: preferences}
  - click: {role: button, label: Tags}
  - assert_state: {key: screen.category, equals: tags}
  - assert_exists: {role: check_box, label: Require a tag on every line}
  - assert_exists: {role: combo_box, label: Default tag}
  - click: {role: check_box, label: Require a tag on every line}
  - assert_state: {key: screen.dirty, equals: true}
  - screenshot: preferences-tags
  - click: {role: button, label: Save}
  - wait: {ms: 300}
  - assert_state: {key: screen.dirty, equals: false}
  - command: file.close_window
  - wait: {ms: 200}

  # --- Write Check: an untagged line is refused and named ---------------------
  - key: Ctrl+W
  - assert_state: {key: screen.screen, equals: write_check}
  - assert_state: {key: screen.loaded, equals: true}
  - click: {role: button, label: Clear}
  - type: {text: Ozark Feed, target: {role: text_input, label: Pay to the order of}}
  - key: Tab
  - type: {text: "100", target: {role: text_input, label: "Amount ($)"}}
  - key: Tab
  # Payee prefill brought two tagged lines over (accounts and tags, never
  # amounts); a third line has no tag.
  - click: {role: grid_cell, label: "Amount, line 1"}
  - type: {text: "60"}
  - key: Tab
  - click: {role: grid_cell, label: "Amount, line 2"}
  - type: {text: "30"}
  - key: Tab
  - click: {label: "Account, line 3"}
  - type: {text: "6100"}
  - key: Tab
  - type: {text: "10"}
  - key: Tab
  - key: Alt+N
  - wait: {ms: 300}
  - assert_state: {key: screen.save.refused, equals: null}
  - assert_state: {key: screen.saved_count, equals: 0}
  - assert_exists: {label_contains: "Expenses tab, line 3: Add a tag"}
  - screenshot: check-refused
  # Save as Template is not gated (it saves no entry): the untagged line
  # goes into a template.
  - key: Ctrl+M
  - assert_state: {key: screen.template.dialog.title, equals: templates.dialog.title.new}
  - click: {role: text_input, label: Name}
  - key: Ctrl+A
  - type: {text: "{theme} tag rule check"}
  - click: {role: button, label: Save}
  - assert_state: {key: screen.template.dialog, equals: null}
  - assert_state: {key: screen.template.saved_count, equals: 1}
  - click: {role: button, label: Clear}
  - command: file.close_window
  - wait: {ms: 200}

  # --- Template Use: the filled form's save is refused the same way ----------
  - command: lists.templates
  - assert_state: {key: screen.screen, equals: templates}
  - assert_state: {key: screen.loaded, equals: true}
  - click: {role: button, label_contains: "tag rule check"}
  - click: {role: button, label: Use}
  - assert_state: {key: screen.screen, equals: write_check}
  - assert_state: {key: screen.mode, equals: new}
  - key: Alt+N
  - wait: {ms: 300}
  - assert_state: {key: screen.saved_count, equals: 0}
  - assert_exists: {label_contains: "Expenses tab, line 3: Add a tag"}
  - screenshot: template-use-refused
  - click: {role: button, label: Clear}
  - command: file.close_window
  - wait: {ms: 200}
  # The template is deleted so the dark run starts the same.
  - click: {role: tab, label_contains: "Templates"}
  - click: {role: button, label_contains: "tag rule check"}
  - click: {role: button, label: Delete}
  - click: {role: button, label: Delete, index: 1}
  - assert_not_exists: {role: button, label_contains: "tag rule check"}
  - command: file.close_window
  - wait: {ms: 200}

  # --- Bulk Entry: an untagged row is named by section and row ---------------
  - command: banking.bulk_entry
  - assert_state: {key: screen.screen, equals: batch_entry}
  - assert_state: {key: screen.loaded, equals: true}
  - click: {role: button, label: Clear}
  - click: {label: "Date, line 1"}
  - type: {text: "T"}
  - key: Tab
  - key: Tab
  - key: Tab
  - type: {text: "Hollister Fuel"}
  - key: Tab
  - key: Tab
  - type: {text: "12.00"}
  - key: Tab
  - key: Enter
  - assert_state: {key: screen.problems, equals: 0}
  - key: Alt+S
  - wait: {ms: 300}
  - assert_state: {key: screen.saved_count, equals: 0}
  - assert_exists: {label_contains: "Section 1, row 1: Add a tag"}
  - screenshot: bulk-entry-refused
  - click: {role: button, label: Clear}
  - command: file.close_window
  - wait: {ms: 200}

  # --- Bank Feed (P29 review B1): untagged lines aren't recorded ------------
  # The sample's lines carry no tag: Accept selected leaves them waiting and
  # names them; A on one says it needs a tag. Nothing posts.
  - command: banking.import_file
  - command: dev.demo_bank_import_reset
  - command: banking.feed
  - command: dev.demo_feed_reset
  - assert_state: {key: screen.screen, equals: bank_feed}
  - click: {role: button, label: Ready 28}
  - click: {role: button, label_contains: "Bank line 1 of 28:"}
  - key: Space
  - key: J
  - key: Space
  - key: Ctrl+Enter
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 0}
  - assert_state: {key: screen.notice, equals: bank_feed.notice.tag_needed}
  - assert_state: {key: screen.tag_skipped, equals: 2}
  - assert_exists: {label_contains: "Left waiting because they need a tag:"}
  - screenshot: bank-feed-refused
  - key: A
  - assert_state: {key: screen.counts.accepted, equals: 0}
  - assert_state: {key: screen.notice, equals: bank_feed.notice.tag_needed}
  - command: file.close_window
  - wait: {ms: 200}

  # --- Back to off for the next run -----------------------------------------
  - command: edit.preferences
  - click: {role: button, label: Tags}
  - click: {role: check_box, label: Require a tag on every line}
  - click: {role: button, label: Save}
  - wait: {ms: 300}
  - assert_state: {key: screen.dirty, equals: false}
  - command: file.close_window
  - wait: {ms: 200}
