# Receipts in the Bank Feed (A05, Q-282, Q-A05a-c) against
# `clientledger --demo`. `dev.demo_feed_receipt` puts a synthetic receipt in
# the review queue whose total is a waiting money-out line's amount exactly
# (stored with 4 decimals, dated two days earlier, two lines that add up)
# and moves the cursor to that line. The line shows the Receipt badge; the
# panel's Receipt section picks it, shows it in the pop-out viewer, and
# Accept posts one entry coded from it with the receipt attached. Undo
# takes the entry back and the receipt returns to Review Documents. "Don't
# use this receipt" accepts the line without it (the receipt stays in the
# queue). Light and dark run in one app; each run starts with one receipt
# (the earlier run's live one is thrown away). All data is synthetic.
name: bank_feed_receipts
description: A receipt in the review queue matches a bank line - Receipt badge, the panel's Receipt section and viewer, Accept attaches it, Undo puts it back, Don't use this receipt.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: banking.import_file
  - command: dev.demo_bank_import_reset
  - command: banking.feed
  - command: dev.demo_feed_reset
  - assert_state: {key: screen.counts.waiting, equals: 37}
  - assert_state: {key: screen.badges.receipt, equals: 0}
  - command: dev.demo_feed_receipt
  - assert_state: {key: screen.busy, equals: false}

  # --- 1. The badge and the panel's Receipt section ----------------------------
  - assert_state: {key: screen.receipts.on, equals: true}
  - assert_state: {key: screen.receipts.lines, equals: 1}
  - assert_state: {key: screen.badges.receipt, equals: 1}
  - assert_state: {key: screen.receipts.offers, equals: 1}
  - assert_state: {key: screen.receipts.best_picked, equals: true}
  - assert_state: {key: screen.receipts.read, equals: true, within_ms: 5000}
  - assert_state: {key: screen.detail.mode, equals: categorize}
  - assert_exists: {label: Receipt}
  # QA-2 / QA-5: the vendor as read (not in the list), the reference.
  - assert_exists: {role: radio_button, label_contains: "Synthetic Hardware Co."}
  - assert_exists: {role: radio_button, label_contains: "Ref R-1042"}
  - assert_exists: {role: radio_button, label: "Don't use this receipt"}
  - assert_exists: {role: button, label: Show receipt}
  - screenshot: receipt-offer

  # --- 2. The receipt in the pop-out viewer -------------------------------------
  - click: {role: button, label: Show receipt}
  - assert_state: {key: screen.receipts.shown, equals: true, within_ms: 5000}
  - assert_state: {key: doc_viewer.popped, equals: true, within_ms: 5000}
  - assert_state: {key: doc_viewer.has_doc, equals: true}
  - screenshot: {name: receipt-viewer, viewport: doc_viewer}
  - key: Ctrl+Shift+D
  - assert_state: {key: doc_viewer.popped, equals: false}

  # --- 3. Accept: one entry, the receipt attached ------------------------------
  - key: A
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.last_send, equals: accept}
  - assert_state: {key: screen.counts.accepted, equals: 1}
  - assert_state: {key: screen.counts.waiting, equals: 36}
  - assert_state: {key: screen.receipts.lines, equals: 0}
  - assert_state: {key: screen.receipts.drafts, equals: 0}
  - assert_state: {key: screen.toast, equals: 1}
  - screenshot: receipt-accepted

  # --- 4. Undo: the receipt goes back to the review queue -----------------------
  - click: {role: button, label: Undo}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 0}
  - assert_state: {key: screen.notice, equals: bank_feed.notice.undone_receipt}
  - assert_exists: {label_contains: "The receipt is back in Review Documents."}
  - assert_state: {key: screen.receipts.drafts, equals: 1}
  - assert_state: {key: screen.receipts.lines, equals: 1}
  - screenshot: receipt-undone

  # --- 5. Don't use this receipt: the line posts without it --------------------
  - command: dev.demo_feed_receipt
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.receipts.picked, equals: true, within_ms: 5000}
  - click: {role: radio_button, label: "Don't use this receipt"}
  - assert_state: {key: screen.receipts.picked, equals: false}
  - screenshot: receipt-declined
  - key: A
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 1}
  # The receipt stays in the queue for A04's "Attach to an existing entry".
  - assert_state: {key: screen.receipts.drafts, equals: 1}
  - assert_state: {key: screen.receipts.lines, equals: 0}
  - click: {role: button, label: Undo}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 0}
  - assert_state: {key: screen.notice, equals: bank_feed.notice.undone}

  # --- 6. QA-1: a line nothing was suggested for shows its receipt ------------
  - command: dev.demo_feed_receipt_bare
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.receipts.lines, equals: 1}
  - assert_state: {key: screen.badges.receipt, equals: 1}
  - assert_state: {key: screen.receipts.read, equals: true, within_ms: 5000}
  - assert_state: {key: screen.detail.account_chosen, equals: false}
  # QA-2: the receipt supplies the vendor: only the account is asked for.
  - assert_exists: {label_contains: "Choose an account for this bank line."}
  - screenshot: receipt-bare-line
  - key: C
  - type: {text: "bank fees"}
  - key: Enter
  - assert_state: {key: screen.detail.account_chosen, equals: true}
  - assert_not_exists: {label_contains: "Choose an account for this bank line."}
  - assert_not_exists: {label_contains: "Choose a payee and an account"}
  - screenshot: receipt-bare-account
  - key: A
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 1}
  - assert_state: {key: screen.receipts.drafts, equals: 0}
  - click: {role: button, label: Undo}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 0}
  - assert_state: {key: screen.notice, equals: bank_feed.notice.undone_receipt}

  # --- 7. QA-5: two copies of one receipt read differently ---------------------
  - command: dev.demo_feed_receipt_two
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.receipts.offers, equals: 2}
  - assert_state: {key: screen.receipts.read, equals: true, within_ms: 5000}
  - assert_exists: {role: radio_button, label_contains: "receipt-a.pdf"}
  - assert_exists: {role: radio_button, label_contains: "receipt-b.pdf"}
  - screenshot: receipt-two-offers
