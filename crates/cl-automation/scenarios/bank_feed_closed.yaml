# Bank Feed in a closed period (P26 DI-2, plan §5 and §6 "Closed period with
# password", test 1 in small) against `clientledger --demo`. The books are
# closed through 11/01: Accept selected on the 28 ready lines posts the open
# ones at once (the credit card payment stays: a transfer is accepted on
# its own) and asks once for the closing-date password for the ten lines of
# 11/01; a wrong password keeps the dialog, the right one (demo-close)
# records them.
name: bank_feed_closed
description: Accept selected with locked lines - one closing-date password prompt, wrong then right, then the locked lines post.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: banking.import_file
  - command: dev.demo_bank_import_reset
  - command: banking.feed
  - command: dev.demo_feed_reset
  - command: dev.demo_feed_close_books
  - click: {role: button, label: Ready 28}
  - click: {role: check_box, label: Select all bank lines}
  - assert_state: {key: screen.selected, equals: 28}
  - key: Ctrl+Enter
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 17}
  - assert_state: {key: screen.closing.closing, equals: asking}
  - assert_exists: {role: password_input, label: Closing-date password}
  - screenshot: closed-asking
  - click: {role: password_input, label: Closing-date password}
  - type: {text: not-the-password}
  - click: {role: button, label: Change}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.closing.closing, equals: rejected}
  - assert_state: {key: screen.counts.accepted, equals: 17}
  - click: {role: password_input, label: Closing-date password}
  - type: {text: demo-close}
  - click: {role: button, label: Change}
  - assert_state: {key: screen.busy, equals: false}
  - assert_state: {key: screen.counts.accepted, equals: 27}
  - assert_state: {key: screen.counts.ready, equals: 1}
  - screenshot: closed-recorded
  - command: dev.demo_feed_reset