# Switch from another program (P31): the Generic CSV layout (synthetic
# fixtures/imports/generic and generic-altered). The base set ties out to 0.00.
# In the altered set the 03/01/2026 utilities row reads 301.20 instead of
# 310.20: exactly 1010 and 6010 differ (9.00 and -9.00) and Mark verified
# stays off.
name: system_import_generic
description: Spreadsheet layout - base set ties out; the altered ledger differs on 1010 and 6010 only.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: file.import_system
  - command: dev.imports_demo_reset
  - click: {role: radio_button, label: Another program (spreadsheet layout)}
  - assert_state: {key: screen.source, equals: generic}
  - key: Alt+N
  - assert_state: {key: screen.step, equals: dates}
  - click: {role: text_input, label: Switch date}
  - key: Ctrl+A
  - type: {text: "06/30/2026"}
  - click: {role: text_input, label: Opening balance date}
  - key: Ctrl+A
  - type: {text: "12/31/2025"}
  - screenshot: dates
  - key: Alt+N
  - assert_state: {key: screen.step, equals: files}
  - command: dev.imports_demo_file_all
  - assert_state: {key: screen.files_uploaded, equals: 5, within_ms: 6000}
  - assert_state: {key: screen.files_refused, equals: 0}
  - assert_state: {key: screen.can_next, equals: true}
  - screenshot: files
  - key: Alt+N
  - assert_state: {key: screen.step, equals: mapping}
  - assert_state: {key: screen.unmapped, equals: 0}
  - key: Alt+N
  - assert_state: {key: screen.step, equals: import}
  - key: Alt+N
  - assert_state: {key: screen.step, equals: tieout, within_ms: 8000}
  - assert_state: {key: screen.tieout_all_zero, equals: true, within_ms: 4000}
  - assert_state: {key: screen.tieout_differences, equals: 0}
  - screenshot: tieout
  - key: Alt+N
  - assert_state: {key: screen.verified, equals: true, within_ms: 4000}
  - command: dev.imports_demo_reset
  - click: {role: radio_button, label: Another program (spreadsheet layout)}
  - key: Alt+N
  - assert_state: {key: screen.step, equals: dates}
  - click: {role: text_input, label: Switch date}
  - key: Ctrl+A
  - type: {text: "06/30/2026"}
  - click: {role: text_input, label: Opening balance date}
  - key: Ctrl+A
  - type: {text: "12/31/2025"}
  - key: Alt+N
  - assert_state: {key: screen.step, equals: files}
  - command: dev.imports_demo_file_all
  - click: {role: button, label: Remove General Ledger file 1}
  - assert_state: {key: screen.files, equals: 4, within_ms: 4000}
  - dialog_answer: {paths: ["{scenario_dir}/../../../fixtures/imports/generic-altered/gl.csv"]}
  - click: {role: button, label: Add file for General Ledger}
  - assert_state: {key: screen.files_uploaded, equals: 5, within_ms: 6000}
  - key: Alt+N
  - key: Alt+N
  - key: Alt+N
  - assert_state: {key: screen.step, equals: tieout, within_ms: 8000}
  - assert_state: {key: screen.tieout_all_zero, equals: false, within_ms: 4000}
  - assert_state: {key: screen.tieout_differences, equals: 2}
  - command: dev.imports_demo_differences_only
  - assert_state: {key: screen.tieout_rows_shown, equals: 2}
  - assert_exists: {label_contains: "1010"}
  - assert_exists: {label_contains: "6010"}
  - screenshot: altered
  - command: dev.imports_demo_differences_only
  - assert_state: {key: screen.can_next, equals: false}
  - command: dev.imports_demo_reset
  - command: file.close_window
  - wait: {ms: 300}
