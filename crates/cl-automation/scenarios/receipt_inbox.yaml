# The receipt inbox (P17 WP5, plan §6 "Steps 1, 4") against
# `clientledger --demo`: the demo's own inbox folder (beside its settings,
# filled with synthetic fixture files each time the window opens) lists a
# PDF, a PNG and a scan over 10 MB; a text file is left out. Files are
# offered only once they stayed the same for two listings 2 s apart. The
# too-large scan is greyed and never read. Add to a check… attaches the PNG
# to a demo check and files the original away (it leaves the list). New
# check opens Write Check with the PDF as its draft; the check is cleared,
# so the PDF stays in the inbox, marked as on an unsaved form (plan
# amendment S8: originals move only once a saved record holds them). Then
# the minimum window at 200%. Nothing is saved, so light and dark start
# the same way.
name: receipt_inbox
description: Inbox list with a too-large file greyed, preview, Add to a check files the original away, New check keeps it until saved, minimum window at 200%.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: nav.receipt_inbox
  - assert_state: {key: screen.screen, equals: receipt_inbox}
  - assert_state: {key: screen.folder, equals: ok}
  # The text file is not listed; the large scan is, as too large.
  - assert_state: {key: screen.listed, equals: 3}
  - assert_state: {key: screen.too_large, equals: 1}
  # Ready only after two equal listings at least 2 s apart.
  - wait: {ms: 2600}
  - assert_state: {key: screen.ready, equals: 2}
  - assert_exists: {label: 2 files ready}
  - assert_disabled: {role: button, label: Scanned statement.pdf}
  - assert_enabled: {role: button, label: Ozark Feed receipt.png}
  - assert_exists: {role: button, label: Choose a folder…}
  - assert_exists: {role: button, label: Check now}
  - screenshot: inbox

  # --- Preview and Add to a check… -------------------------------------------
  - click: {role: button, label: Ozark Feed receipt.png}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_state: {key: screen.selected_kind, equals: png}
  - assert_state: {key: screen.preview.status, equals: ready}
  - assert_exists: {role: image, label: Preview of Ozark Feed receipt.png}
  - assert_enabled: {role: button, label: New bill}
  - assert_enabled: {role: button, label: Add to a bill…}
  - assert_enabled: {role: button, label: New check}
  - assert_enabled: {role: button, label: Add to a bank transaction…}
  - screenshot: preview
  - click: {role: button, label: Add to a check…}
  - assert_state: {key: screen.picker.kind, equals: check}
  - assert_state: {key: screen.picker.loaded, equals: true}
  - assert_exists: {role: button, label: Attach, index: 0}
  - screenshot: picker
  - click: {role: button, label: Attach, index: 0}
  - assert_state: {key: screen.problem, equals: null}
  - assert_state: {key: screen.notice, equals: true}
  # Filed away: gone from the list, the other file still ready.
  - assert_not_exists: {role: button, label: Ozark Feed receipt.png}
  - assert_state: {key: screen.ready, equals: 1}
  - assert_state: {key: screen.selected, equals: false}
  - screenshot: attached

  # --- New check: the file stays until a saved check holds it ---------------
  - click: {role: button, label: Midwest Equipment INV-55871.pdf}
  - assert_state: {key: screen.loaded, equals: true}
  - click: {role: button, label: New check}
  - assert_state: {key: screen.screen, equals: write_check}
  - assert_exists: {label: Attached from Midwest Equipment INV-55871.pdf in your receipt inbox.}
  - assert_state: {key: screen.dirty, equals: true}
  - screenshot: new-check
  - click: {role: button, label: Clear}
  - command: file.close_window
  - click: {role: tab, label_contains: Receipt Inbox}
  - assert_state: {key: screen.screen, equals: receipt_inbox}
  - assert_exists: {role: button, label: Midwest Equipment INV-55871.pdf}
  - assert_state: {key: screen.selected_mark, equals: uploaded}
  - assert_exists: {label_contains: on a form that isn't saved yet}
  - screenshot: kept

  # --- Minimum window at 200%: nothing drawn over anything ---------------------
  - resize: {width: 960, height: 640}
  - set_zoom: {percent: 200}
  - screenshot: inbox-z200
  - assert_no_clipping:
      ignore:
        # The tab strip scrolls, with the » list.
        - {x: -4000, y: 70, width: 8480, height: 40}
        # The inbox body scrolls: the row running under the status bar.
        - {x: -4000, y: 285, width: 8480, height: 60}
  # The actions are reached by scrolling.
  - scroll: {target: {label: 1 file ready}, to: end}
  - assert_exists: {role: button, label: Add to a bank transaction…}
  - screenshot: inbox-z200-end
  - set_zoom: {percent: 100}
  - resize: {width: 1440, height: 940}

  # --- Close ---------------------------------------------------------------------
  - command: file.close_window
  - click: {role: tab, label: Home}
