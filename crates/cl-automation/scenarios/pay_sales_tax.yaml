# Pay Sales Tax (P23 WP-3, Vendors > Pay Sales Tax) against
# `clientledger --demo`: through 11/30, the engine's lines and total, an
# adjustment needs its account and reason, Pay queues a check to print
# (Print later is the default), then Void makes the tax owed again.
# Synthetic.
name: pay_sales_tax
description: "Pay sales tax: lines, adjustment, check queued, void."
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: vendors.pay_sales_tax
  - assert_state: {key: screen.screen, equals: pay_sales_tax}
  - assert_state: {key: screen.available, equals: true}
  - command: dev.demo_sales_tax_story
  - assert_state: {key: screen.agency, equals: true}
  - assert_state: {key: screen.print_later, equals: true}
  - click: {role: text_input, label: Pay tax owed through}
  - key: Ctrl+A
  - type: {text: "11/30/2026"}
  - key: Tab
  - assert_state: {key: screen.lines, equals: 2}
  - screenshot: lines
  - assert_no_clipping: {}
  # An adjustment without its account and reason is refused locally.
  - click: {role: button, label: Add adjustment}
  - assert_state: {key: screen.adjustments, equals: 1}
  - click: {role: button, label: Pay}
  - assert_state: {key: screen.problem, equals: "pay_sales_tax.problem.bad_adjustment"}
  - click: {role: button, label: Remove}
  - assert_state: {key: screen.adjustments, equals: 0}
  - click: {role: button, label: Pay}
  - assert_state: {key: screen.problem, equals: null}
  - assert_state: {key: screen.paid.queued, equals: true}
  - assert_state: {key: screen.notice, equals: "sales_tax.pay.saved_queued"}
  - assert_state: {key: screen.total, equals: "0.0000"}
  - screenshot: paid
  - click: {role: button, label: "Void 11/04/2026"}
  - assert_state: {key: screen.notice, equals: "sales_tax.pay.voided"}
  - screenshot: voided
  # Mark paid through: a confirmation that says to do it only for tax
  # really paid, then nothing is owed through the date and no check is
  # made. "Undo mark paid through" takes it back (the demo-only reset is
  # kept so the dark run always starts clean).
  - click: {role: button, label: "Mark paid through…"}
  - assert_state: {key: screen.confirm_mark, equals: true}
  - assert_exists: {role: label, label_contains: "really paid"}
  - screenshot: mark-paid-confirm
  - click: {role: button, label: Mark as paid}
  - assert_state: {key: screen.notice, equals: "sales_tax.pay.marked_paid"}
  - assert_state: {key: screen.total, equals: "0.0000"}
  - assert_state: {key: screen.marked.undo, equals: true}
  - screenshot: marked-paid
  - click: {role: button, label: Undo mark paid through}
  - assert_state: {key: screen.notice, equals: "sales_tax.pay.mark_undone"}
  - assert_state: {key: screen.marked, equals: null}
  - command: dev.demo_mark_paid_reset
  - assert_state: {key: screen.marked, equals: null}
  - command: file.close_window
