# Sensitive accounts (P29, U-33, acceptance 3) against `clientledger --demo`:
# the Admin marks 6550 Wages sensitive in the Chart of Accounts; a
# Bookkeeper without "See sensitive accounts" (developer switch) gets the
# Profit & Loss without a Wages row and with "Some amounts are hidden for
# your role", the drill behind an amount with the same notice, and the
# checking register showing "Hidden account" as the other side of a
# paycheck. Back to Admin and the mark removed; then a Vehicles register
# open while the role changes closes with a plain message. Marks removed at
# the end, so the dark run starts the same. Synthetic.
name: sensitive_accounts
description: Admin marks Wages sensitive; a Bookkeeper's P&L, drill and register hide it with a notice.
steps:
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - command: dev.demo_rights_all
  # --- 1. The Admin marks Wages ---------------------------------------------
  - command: lists.chart_of_accounts
  - wait: {ms: 300}
  - assert_state: {key: screen.screen, equals: chart_of_accounts}
  - assert_state: {key: screen.loaded, equals: true}
  - type: {text: "6550"}
  - assert_exists: {role: row, label_contains: "6550 Wages"}
  - key: Ctrl+E
  - assert_state: {key: screen.panel, equals: edit}
  - click: {role: check_box, label: Sensitive account}
  - key: Alt+S
  - assert_state: {key: screen.panel, equals: none}
  - assert_state: {key: screen.selected_sensitive, equals: true}
  - screenshot: marked
  - command: file.close_window
  - wait: {ms: 200}
  # --- 2. A Bookkeeper without the right --------------------------------------
  - command: dev.demo_rights_bookkeeper_hidden
  - assert_state: {key: is_admin, equals: false}
  - command: reports.center
  - wait: {ms: 300}
  # A window left from an earlier run runs again for this user.
  - command: reports.refresh
  - wait: {ms: 500}
  - assert_state: {key: screen.report, equals: profit_loss}
  - assert_state: {key: screen.state, equals: shown}
  - assert_state: {key: screen.hidden_notice, equals: true}
  - assert_exists: {label_contains: "Some amounts are hidden for your role"}
  - assert_not_exists: {label: Wages}
  - screenshot: profit-loss
  # The drill behind an amount says the same (link 0 is "Manage…").
  - click: {role: link, index: 1}
  - wait: {ms: 500}
  - assert_state: {key: screen.report, equals: transaction_detail_by_account}
  - assert_state: {key: screen.hidden_notice, equals: true}
  - assert_not_exists: {label: Wages}
  - screenshot: drill
  # The drill runs in the report's own window: one close.
  - command: file.close_window
  - wait: {ms: 200}
  # The checking register: a paycheck's other side is "Hidden account".
  - command: lists.chart_of_accounts
  - wait: {ms: 300}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_not_exists: {role: row, label_contains: "6550 Wages"}
  - type: {text: "1010"}
  - key: Ctrl+G
  - wait: {ms: 500}
  - assert_state: {key: screen.screen, equals: register}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_state: {key: screen.hidden_rows, equals: 6}
  - screenshot: register
  - command: file.close_window
  - wait: {ms: 200}
  # The Bookkeeper's chart is closed so the Admin's reads the chart again.
  - command: lists.chart_of_accounts
  - wait: {ms: 200}
  - command: file.close_window
  - wait: {ms: 200}
  # --- 3. Back to Admin; the mark is removed -----------------------------------
  - command: dev.demo_rights_all
  - assert_state: {key: is_admin, equals: true}
  - command: lists.chart_of_accounts
  - wait: {ms: 300}
  - assert_state: {key: screen.loaded, equals: true}
  - type: {text: "6550"}
  - key: Ctrl+E
  - click: {role: check_box, label: Sensitive account}
  - key: Alt+S
  - assert_state: {key: screen.selected_sensitive, equals: false}
  - command: file.close_window
  - wait: {ms: 200}
  # --- 4. A register whose account turns hidden mid-session closes ---------
  - command: lists.chart_of_accounts
  - wait: {ms: 300}
  - assert_state: {key: screen.loaded, equals: true}
  - type: {text: "1510"}
  - key: Ctrl+E
  - click: {role: check_box, label: Sensitive account}
  - key: Alt+S
  - assert_state: {key: screen.selected_sensitive, equals: true}
  - key: Ctrl+G
  - wait: {ms: 500}
  - assert_state: {key: screen.screen, equals: register}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_state: {key: screen.hidden_closed, equals: false}
  - click: {role: combo_box, label: Show}
  - click: {role: button, label_contains: This month}
  - assert_state: {key: screen.loaded, equals: true}
  # The role changes while the register is open; its next read is refused.
  - command: dev.demo_rights_bookkeeper_hidden
  - click: {role: combo_box, label: Show}
  - click: {role: button, label_contains: Last 90 days}
  - wait: {ms: 400}
  - assert_not_exists: {role: tab, label_contains: "Vehicles"}
  - assert_exists: {label_contains: "This account is now hidden for your role"}
  - screenshot: register-closed
  # Back to Admin; Vehicles unmarked so the dark run starts the same.
  - command: dev.demo_rights_all
  - command: lists.chart_of_accounts
  - wait: {ms: 200}
  - command: file.close_window
  - wait: {ms: 200}
  - command: lists.chart_of_accounts
  - wait: {ms: 300}
  - assert_state: {key: screen.loaded, equals: true}
  - type: {text: "1510"}
  - key: Ctrl+E
  - click: {role: check_box, label: Sensitive account}
  - key: Alt+S
  - assert_state: {key: screen.selected_sensitive, equals: false}
  - command: file.close_window
