# Write Check and the seven P14 forms at the minimum window (960 x 640) at 200% zoom
# (480 x 320 points): the shared header wraps (toolbar note, title above the
# picker), label+input groups move whole to the next line, and nothing is
# drawn over anything or cut inside its own field. Ignored: the tab strip
# (it scrolls, with the » list) and the bottom band, where the scrolled form
# runs under the status bar. Opens and closes each form with its shortcut or
# command; nothing is saved.
name: forms-zoom
description: The transaction forms at the minimum window (960 x 640) and 200% zoom, nothing drawn over anything.
steps:
  - resize: {width: 1440, height: 940}
  - click: {role: tab, label: Home}
  - resize: {width: 960, height: 640}
  - set_zoom: {percent: 200}
  - key: Ctrl+D
  - assert_state: {key: screen.screen, equals: deposit}
  - screenshot: deposit-z200
  - assert_no_clipping: &zoomed
      ignore:
        - {x: 0, y: 70, width: 480, height: 40}
        - {x: 0, y: 260, width: 480, height: 80}
  - key: Escape
  - key: Ctrl+T
  - assert_state: {key: screen.screen, equals: transfer}
  - screenshot: transfer-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - key: Ctrl+Shift+C
  - assert_state: {key: screen.screen, equals: card_charge}
  - screenshot: card-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: clients.daily_sales
  - screenshot: daily-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: banking.owner_money
  - screenshot: owner-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: vendors.personal_funds
  - screenshot: personal-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: banking.loan_payment
  - screenshot: loan-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: vendors.write_check
  - assert_state: {key: screen.screen, equals: write_check}
  - screenshot: write-check-z200
  - assert_no_clipping: *zoomed
  - set_zoom: {percent: 100}
  - resize: {width: 1440, height: 940}
  - click: {role: tab, label: Home}
