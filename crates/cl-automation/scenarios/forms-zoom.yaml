# Write Check, the seven P14 forms, Make Journal Entry, Templates, Templates
# Due, the Template dialog (P15), Bulk Entry (P15A), Customers & Projects and
# Vendors (P16) at the minimum window (960 x 640) at 200% zoom
# (480 x 320 points): the shared header wraps (toolbar note, title above the
# picker), label+input groups move whole to the next line, and nothing is
# drawn over anything or cut inside its own field. Ignored: the tab strip
# (it scrolls, with the » list, so a tab may sit left of the window) and the
# bottom band, where the scrolled form runs under the status bar. Opens and closes each form with its shortcut or
# command; nothing is saved.
name: forms-zoom
description: The transaction forms at the minimum window (960 x 640) and 200% zoom, nothing drawn over anything.
steps:
  - resize: {width: 1440, height: 940}
  - click: {role: tab, label: Home}
  - resize: {width: 960, height: 640}
  # Bulk Entry at 100% on the minimum window: no title row, the grid takes
  # the height left over and the actions stay above the status bar.
  - command: banking.bulk_entry
  - assert_state: {key: screen.loaded, equals: true}
  - click: {label: "Date, line 1"}
  - type: {text: "T"}
  - key: Tab
  - key: Tab
  - key: Tab
  - type: {text: "Galena Gravel"}
  - key: Tab
  - type: {text: "9999"}
  - key: Tab
  - type: {text: "20"}
  - key: Enter
  - assert_state: {key: screen.problems, equals: 1}
  - screenshot: bulk-entry-960
  - assert_no_clipping: {}
  - click: {role: button, label: Clear}
  - assert_state: {key: screen.last_action, equals: clear}
  - assert_state: {key: screen.rows, equals: 0}
  - command: file.close_window
  - set_zoom: {percent: 200}
  - key: Ctrl+D
  - assert_state: {key: screen.screen, equals: deposit}
  - screenshot: deposit-z200
  - assert_no_clipping: &zoomed
      ignore:
        - {x: -4000, y: 70, width: 8480, height: 40}
        - {x: 0, y: 260, width: 480, height: 80}
  - key: Escape
  - key: Ctrl+T
  - assert_state: {key: screen.screen, equals: transfer}
  - screenshot: transfer-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - key: Ctrl+Shift+C
  - assert_state: {key: screen.screen, equals: card_charge}
  - screenshot: card-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: clients.daily_sales
  - screenshot: daily-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: banking.owner_money
  - screenshot: owner-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: vendors.personal_funds
  - screenshot: personal-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: banking.loan_payment
  - screenshot: loan-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: vendors.write_check
  - assert_state: {key: screen.screen, equals: write_check}
  - screenshot: write-check-z200
  - assert_no_clipping: *zoomed
  # The Template dialog (P15), from the demo's filled-in check.
  - key: Ctrl+M
  - assert_exists: {role: text_input, label: Name}
  - screenshot: template-dialog-z200
  - assert_no_clipping: *zoomed
  - click: {role: button, label: Cancel}
  - key: Ctrl+J
  - assert_state: {key: screen.screen, equals: journal_entry}
  - assert_state: {key: screen.loaded, equals: true}
  - screenshot: journal-z200
  - assert_no_clipping: *zoomed
  - key: Escape
  - command: lists.templates
  - assert_state: {key: screen.screen, equals: templates}
  - screenshot: templates-z200
  - assert_no_clipping: *zoomed
  - command: file.close_window
  - command: lists.templates_due
  - assert_state: {key: screen.screen, equals: templates_due}
  - screenshot: templates-due-z200
  - assert_no_clipping: *zoomed
  - command: file.close_window
  # Bulk Entry (P15A): the sections and the grid scroll above the totals
  # and the actions, which stay on screen; the grid is in the window.
  - command: banking.bulk_entry
  - assert_state: {key: screen.screen, equals: batch_entry}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_exists: {label_contains: "Checks rows"}
  - screenshot: bulk-entry-z200
  - assert_no_clipping: *zoomed
  - click: {role: button, label: Clear}
  - assert_state: {key: screen.last_action, equals: clear}
  - command: file.close_window
  # Customers & Projects and Vendors (P16): the title and toolbar stay at the
  # top (scrolling on their own at this height), the list keeps its
  # headings and three rows, and the details panel sits beside it.
  - command: clients.center
  - assert_state: {key: screen.screen, equals: client_center}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_exists: {role: button, label: Hide details}
  - screenshot: customers-z200
  - assert_no_clipping: &centers
      ignore:
        - {x: -4000, y: 70, width: 8480, height: 40}
        # The top bar scrolls on its own at this height.
        - {x: -4000, y: 104, width: 8480, height: 56}
        # The details panel's body scrolls by design.
        - {x: 264, y: 100, width: 300, height: 260}
  - command: file.close_window
  - command: vendors.center
  - assert_state: {key: screen.screen, equals: vendor_center}
  - assert_state: {key: screen.loaded, equals: true}
  - assert_exists: {role: button, label: Hide details}
  - screenshot: vendors-z200
  - assert_no_clipping: *centers
  - command: file.close_window
  - set_zoom: {percent: 100}
  - resize: {width: 1440, height: 940}
  - click: {role: tab, label: Home}
