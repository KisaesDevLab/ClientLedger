# Enter Bill (P17 plan §6) against `clientledger --demo`: the mockup's story
# (Midwest Equipment Rental, INV-55871, 1,330.00 + 150.00 = 1,480.00 on
# 6210 · Equipment rental), the vendor's default account and terms (Net 15,
# due 11/18), no save while the lines and the amount due disagree, "Lines
# total = amount due ✓", Save & New, the next bill copying the last one
# without amounts, a vendor credit, the closing-date password, the
# unsaved-changes question on Prev, Void, Read with AI on the story invoice
# (the demo's canned reading: read values refused until accepted, ghost
# accounts set with Tab) and the same bill typed by hand with reading
# switched off (AC3). Section 11 (A03) reads documents on this computer
# with Read document (the real worker; synthetic PDFs: the story invoice,
# fixtures/docs/bill_read_mismatch.pdf and the encrypted fixture).
#
# The demo plays an engine with the P17 engine work (PR-A); the pinned
# engine's refusals (closed period without `ap-closing-v1`, no Items tab
# without `bill-lines-v1`) are covered by the unit tests. The vendor panel
# (WP8) has its own steps; Read with AI (WP7) is sections 9 and 10.
#
# Light and dark run in the same app, so the scenario is repeatable: it voids
# the story bill at the end (Q-P13w), so the vendor has no posted bill when
# the next pass starts; the closed-period bill is for another vendor. The
# synthetic demo closing-date password is "demo-close". All data is
# synthetic.
name: bill
description: Mockup bill, refused mismatch, Save & New, prefill, vendor credit, closing password, Prev prompt, void, Read with AI, reading off, Read document on this computer.
steps:
  # --- 1. The window and its toolbar -----------------------------------------
  - resize: {width: 1440, height: 940}
  - set_zoom: {percent: 100}
  - key: Ctrl+B
  - assert_exists: {role: tab, label_contains: "Enter Bill"}
  - assert_state: {key: screen.screen, equals: enter_bill}
  - assert_state: {key: screen.loaded, equals: true}
  - click: {role: button, label: Clear}
  - assert_state: {key: screen.dirty, equals: false}
  - assert_state: {key: screen.mode, equals: new}
  - assert_state: {key: screen.kind, equals: bill}
  - assert_state: {key: screen.date, equals: "2026-11-04"}
  - assert_state: {key: screen.bill_received, equals: true}
  - assert_exists: {role: check_box, label: Bill received}
  - assert_disabled: {role: button, label: Save as Template}
  - assert_exists: {label: Vendor credit}
  - assert_exists: {label_contains: "Items"}
  - assert_exists: {label: Source document}
  # Match Vendor Statement is in the toolbar's More menu (and Vendors).
  - assert_exists: {role: button, label: More}
  - assert_not_exists: {role: button, label_contains: Match Vendor Statement}
  # The form's keys in the status bar (mockup): Tab, Ctrl Ins, Ctrl L, Esc.
  - assert_exists: {role: label, label: next field}
  - assert_exists: {role: label, label: insert line}
  - assert_exists: {role: label, label: list}
  - assert_exists: {role: label, label: revert}
  # The actions take Tab in the order shown: Clear, Save & New, Save & Close.
  - focus: {role: button, label: Clear}
  - key: Tab
  - assert_focused: {role: button, label: Save & New}
  - key: Tab
  - assert_focused: {role: button, label: Save & Close}

  # --- 2. Vendor: the default account and terms (no earlier bill) ------------
  # Tab with the vendor list open takes the name and goes on to the Date.
  - type: {text: Midwest Equip, target: {role: text_input, label: Vendor}}
  - assert_state: {key: screen.vendor_list, equals: true}
  - key: Tab
  - assert_focused: {role: text_input, label: Date}
  - assert_value: {target: {role: text_input, label: Vendor}, equals: "Midwest Equipment Rental"}
  - assert_state: {key: screen.has_vendor, equals: true}
  - assert_state: {key: screen.prefill.source, equals: default}
  - assert_state: {key: screen.terms, equals: net_15}
  - assert_value: {target: {label: "Account, line 1"}, equals: "6210 · Equipment rental"}
  - assert_value: {target: {label: "Amount, line 1"}, equals: ""}
  - assert_value: {target: {role: multiline_text_input, label: Address}, equals: "Midwest Equipment Rental\n88 Industrial Pkwy\nJoplin, MO 64801"}

  # --- 3. Date, ref, amount due, memo ----------------------------------------
  - click: {role: text_input, label: Date}
  - key: Ctrl+A
  - type: {text: "11/03/2026"}
  - key: Tab
  - assert_state: {key: screen.date, equals: "2026-11-03"}
  # Net 15 from 11/03.
  - assert_state: {key: screen.due_date, equals: "2026-11-18"}
  - assert_value: {target: {role: text_input, label: Bill due}, equals: "11/18/2026"}
  # Net 15 has no early-payment discount: "—", not a field (Q-P17g).
  - assert_value: {target: {role: text_input, label: Discount date}, equals: "—"}
  - assert_disabled: {role: text_input, label: Discount date}
  - type: {text: "INV-55871", target: {role: text_input, label: Ref. no.}}
  - type: {text: "1480.00", target: {role: text_input, label: "Amount due ($)"}}
  - key: Tab
  - assert_value: {target: {role: text_input, label: "Amount due ($)"}, equals: "1,480.00"}
  - click: {role: text_input, label: Memo}
  - type: {text: "Mini excavator + delivery · Long Creek Marina seawall"}
  - assert_exists: {role: tab, label_contains: "INV-55871"}

  # --- 4. Lines that disagree: nothing is saved ------------------------------
  - click: {role: grid_cell, label: "Amount, line 1"}
  - type: {text: "1330.00"}
  - key: Tab
  - type: {text: Mini excavator, 2 days}
  - key: Enter
  - type: {text: "6210"}
  - key: Tab
  - type: {text: "149.00"}
  - key: Tab
  - type: {text: Delivery and pickup}
  - key: Enter
  - assert_state: {key: screen.expense_lines, equals: 2}
  - assert_state: {key: screen.totals, equals: remaining}
  - assert_exists: {role: label, label_contains: "1.00 left to assign"}
  - key: Alt+S
  - assert_state: {key: screen.save.refused, equals: lines_disagree}
  - assert_state: {key: screen.saving, equals: false}
  - assert_state: {key: screen.saved_count, equals: 0}
  - assert_exists: {role: label, label_contains: "lines don't add up to the amount due"}
  - assert_exists: {role: tab, label_contains: "Enter Bill"}
  - screenshot: lines-disagree

  # --- 5. Fixed: "Lines total = amount due ✓", Save & New ---------------------
  - click: {role: grid_cell, label: "Amount, line 2"}
  - type: {text: "150.00"}
  - key: Tab
  - assert_state: {key: screen.totals, equals: balanced}
  - assert_exists: {role: label, label: "Lines total = amount due ✓"}
  - assert_state: {key: screen.save.refused, equals: null}
  - assert_no_clipping: {}
  - screenshot: balanced
  - key: Alt+N
  - assert_state: {key: screen.saved_count, equals: 1}
  - assert_state: {key: screen.last_saved.kind, equals: bill}
  - assert_state: {key: screen.dirty, equals: false}
  - assert_state: {key: screen.has_vendor, equals: false}
  # Save & New keeps the date.
  - assert_state: {key: screen.date, equals: "2026-11-03"}

  # === P17 WP8: vendor panel and duplicate ref (begin) =======================
  # --- 5b. The panel shows the engine's open balance (the bill just saved),
  # the default account and 1099 rows; a new ref gets the check mark; typing
  # INV-55871 again warns, and Save asks "Save anyway / Go back" (a warning,
  # never a block, Q-P17n). Go back saves nothing; Clear leaves the form as
  # Save & New did (the next step starts from a blank bill).
  - type: {text: Midwest Equip, target: {role: text_input, label: Vendor}}
  - key: Tab
  - assert_state: {key: screen.has_vendor, equals: true}
  - assert_state: {key: screen.panel.summary, equals: ready}
  - assert_exists: {role: label, label: Open balance}
  - assert_exists: {role: label, label: "1,480.00", index: 0}
  - assert_exists: {role: label, label: Default account}
  - assert_exists: {role: label, label: "6210 · Equipment rental"}
  - assert_exists: {role: label, label: 1099 vendor}
  - assert_state: {key: screen.panel.open_bills_count, equals: 1}
  - assert_state: {key: screen.panel.open_bills_shown, equals: 1}
  - type: {text: "INV-55872", target: {role: text_input, label: Ref. no.}}
  - assert_state: {key: screen.panel.duplicate_check, equals: clear}
  - assert_exists: {role: label, label: "No other bill uses ref. no. INV-55872 ✓"}
  - click: {role: text_input, label: Ref. no.}
  - key: Ctrl+A
  - type: {text: "INV-55871"}
  - assert_state: {key: screen.panel.duplicate_check, equals: found}
  - assert_exists: {role: label, label_contains: "already uses ref. no. INV-55871."}
  - assert_exists: {label: Open that bill}
  - assert_no_clipping: {}
  - screenshot: duplicate-ref
  - type: {text: "1480.00", target: {role: text_input, label: "Amount due ($)"}}
  - key: Tab
  - click: {role: grid_cell, label: "Amount, line 1"}
  - type: {text: "1330.00"}
  - key: Tab
  - click: {role: grid_cell, label: "Amount, line 2"}
  - type: {text: "150.00"}
  - key: Tab
  - assert_state: {key: screen.totals, equals: balanced}
  - key: Alt+S
  - assert_state: {key: screen.panel.duplicate_prompt, equals: true}
  - assert_exists: {role: label, label_contains: "Another bill from this vendor already uses ref. no. INV-55871 (11/03/2026)"}
  - assert_exists: {role: button, label: Save anyway}
  - assert_exists: {role: button, label: Go back}
  - assert_state: {key: screen.saved_count, equals: 1}
  - screenshot: duplicate-prompt
  - click: {role: button, label: Go back}
  - assert_state: {key: screen.panel.duplicate_prompt, equals: false}
  - assert_state: {key: screen.saved_count, equals: 1}
  - assert_state: {key: screen.focused, equals: reference}
  - click: {role: button, label: Clear}
  - assert_state: {key: screen.dirty, equals: false}
  - assert_state: {key: screen.has_vendor, equals: false}
  # === P17 WP8 (end) =========================================================

  # --- 6. A vendor credit: the vendor's last bill comes over, no amounts -------
  - click: {label: Vendor credit}
  - assert_state: {key: screen.kind, equals: credit}
  - assert_exists: {role: tab, label_contains: "Vendor Credit"}
  - assert_exists: {role: text_input, label: "Credit amount ($)"}
  - type: {text: Midwest Equip, target: {role: text_input, label: Vendor}}
  - key: Tab
  - assert_state: {key: screen.prefill.source, equals: bill}
  - assert_value: {target: {label: "Account, line 1"}, equals: "6210 · Equipment rental"}
  - assert_value: {target: {label: "Amount, line 1"}, equals: ""}
  - assert_value: {target: {label: "Amount, line 2"}, equals: ""}
  - click: {role: grid_cell, label: "Account, line 2"}
  - key: Ctrl+Delete
  - assert_state: {key: screen.expense_lines, equals: 1}
  - type: {text: "150.00", target: {role: text_input, label: "Credit amount ($)"}}
  - key: Tab
  - click: {role: grid_cell, label: "Amount, line 1"}
  - type: {text: "150.00"}
  - key: Tab
  - assert_state: {key: screen.totals, equals: balanced}
  - screenshot: vendor-credit
  - key: Alt+N
  - assert_state: {key: screen.saved_count, equals: 2}
  - assert_state: {key: screen.last_saved.kind, equals: credit}
  - click: {label: Bill}
  - assert_state: {key: screen.kind, equals: bill}

  # --- 7. Closed period (demo closing date 09/30/2026) ------------------------
  - click: {role: text_input, label: Date}
  - key: Ctrl+A
  - type: {text: "09/15/2026"}
  - key: Tab
  - assert_state: {key: screen.date, equals: "2026-09-15"}
  # The line first, so no prefill runs; leaving the lines gives the blank
  # amount due their total. (The cell may still have its editor open from
  # the save, so it is found by its label alone.)
  - click: {label: "Account, line 1"}
  - type: {text: "6210"}
  - key: Tab
  - type: {text: "18.25"}
  - key: Tab
  - type: {text: Closed-period scenario bill}
  - key: Enter
  - type: {text: Stone County, target: {role: text_input, label: Vendor}}
  - key: Tab
  - assert_state: {key: screen.has_vendor, equals: true}
  - assert_value: {target: {role: text_input, label: "Amount due ($)"}, equals: "18.25"}
  - assert_state: {key: screen.totals, equals: balanced}
  - key: Alt+N
  - assert_state: {key: screen.closing, equals: asking}
  - assert_exists: {role: password_input, label: Closing-date password}
  - assert_exists: {role: label, label_contains: "closing date (09/30/2026)"}
  - screenshot: closing-password
  - click: {role: button, label: Cancel}
  - assert_state: {key: screen.closing, equals: cancelled}
  - assert_state: {key: screen.saved_count, equals: 2}
  - key: Alt+N
  - assert_state: {key: screen.closing, equals: asking}
  - click: {role: password_input, label: Closing-date password}
  - type: {text: not-the-password}
  - click: {role: button, label: Change}
  - assert_state: {key: screen.closing, equals: rejected}
  - assert_not_exists: {label_contains: not-the-password}
  - assert_state: {key: screen.saved_count, equals: 2}
  - click: {role: password_input, label: Closing-date password}
  - type: {text: demo-close}
  - click: {role: button, label: Change}
  - assert_state: {key: screen.closing, equals: done}
  - assert_state: {key: screen.saved_count, equals: 3}
  - assert_state: {key: screen.dirty, equals: false}

  # --- 8. Back to INV-55871 (Page Up, newest first by date: the sample's
  # 11/04 bill, then this pass's 11/03 bill): Prev on unsaved changes asks;
  # then void it (Q-P13w) ------------------------------------------------------
  - key: PageUp
  - key: PageUp
  - assert_state: {key: screen.mode, equals: edit}
  - assert_state: {key: screen.date, equals: "2026-11-03"}
  - assert_exists: {role: tab, label_contains: "INV-55871"}
  - assert_value: {target: {role: text_input, label: "Amount due ($)"}, equals: "1,480.00"}
  - click: {role: text_input, label: Memo}
  - key: End
  - type: {text: " (fall)"}
  - assert_state: {key: screen.dirty, equals: true}
  - key: PageUp
  - assert_state: {key: screen.nav_prompt, equals: true}
  - assert_exists: {role: button, label: Discard changes}
  - assert_exists: {role: button, label: Keep editing}
  - screenshot: nav-prompt
  - click: {role: button, label: Keep editing}
  - assert_state: {key: screen.nav_prompt, equals: false}
  - assert_state: {key: screen.dirty, equals: true}
  # Esc puts the memo back, and the keyboard stays in it.
  - click: {role: text_input, label: Memo}
  - key: Escape
  - assert_value: {target: {role: text_input, label: Memo}, equals: "Mini excavator + delivery · Long Creek Marina seawall"}
  - assert_state: {key: screen.dirty, equals: false}
  - assert_focused: {role: text_input, label: Memo}
  - assert_state: {key: screen.focused, equals: memo}
  - command: edit.void_transaction
  - assert_state: {key: screen.void_open, equals: true}
  - type: {text: Scenario cleanup, target: {role: text_input, label: Reason}}
  - click: {role: button, label: Void}
  - assert_state: {key: screen.last_action, equals: void}
  - assert_state: {key: screen.save.error, equals: false}
  - assert_state: {key: screen.mode, equals: new}
  - assert_no_clipping: {}

  # --- 9. Read with AI (WP7): the demo engine's canned reading of the story
  # invoice (no AI provider is called). Read values wait for the owner's
  # accept (non-negotiable 4); the accounts are ghosts set only by Tab ------
  - click: {role: button, label: Clear}
  - assert_state: {key: screen.read.filled, equals: false}
  - assert_not_exists: {role: button, label: Read with AI}
  - type: {text: "assets/sample/docs/midwest_inv_55871.pdf", target: {role: text_input, label: File}}
  - click: {role: button, label: Attach file}
  - assert_state: {key: screen.attachments.draft_files, equals: 1}
  - assert_state: {key: screen.read.available, equals: true}
  # Nothing is read on upload: only the owner's click reads.
  - assert_state: {key: screen.read.requests, equals: 0}
  - assert_state: {key: screen.has_vendor, equals: false}
  - click: {role: button, label: Read with AI}
  - assert_state: {key: screen.read.filled, equals: true}
  - assert_state: {key: screen.read.requests, equals: 1}
  - assert_state: {key: screen.read.unaccepted, equals: 7}
  - assert_state: {key: screen.read.low, equals: 1}
  - assert_state: {key: screen.read.reconciled, equals: true}
  - assert_state: {key: screen.has_vendor, equals: true}
  - assert_state: {key: screen.date, equals: "2026-11-03"}
  - assert_state: {key: screen.due_date, equals: "2026-11-18"}
  - assert_value: {target: {role: text_input, label: Ref. no.}, equals: "INV-55871"}
  - assert_value: {target: {role: text_input, label: "Amount due ($)"}, equals: "1,480.00"}
  - assert_exists: {role: label, label_contains: "Filled from midwest_inv_55871.pdf"}
  - assert_exists: {role: label, label_contains: "Read from the document", index: 0}
  - assert_exists: {role: label, label_contains: "Not sure about these lines"}
  - assert_exists: {role: button, label: Clear and type it myself}
  - assert_state: {key: screen.read.ghosts.open, equals: 2}
  # A ghost is described, never the cell's value, until accepted.
  - assert_value: {target: {label: "Account, line 1"}, equals: ""}
  - assert_state: {key: screen.totals, equals: balanced}
  - key: Alt+S
  - assert_state: {key: screen.read.save_refused, equals: true}
  - assert_state: {key: screen.saved_count, equals: 3}
  - assert_exists: {role: label, label_contains: "then choose Accept these values"}
  # With the reading banner and the document preview the side column (source
  # document, then the vendor panel) is taller than the body, so the body
  # scrolls by design: a row cut by the bottom of the body (under Save &
  # Close and the status bar) reports its full bounds past the window's edge.
  # The band starts below the action row, so nothing visible is excused; the
  # end of the panel is then checked scrolled into view.
  - assert_no_clipping:
      ignore:
        - {x: 212, y: 905, width: 10000, height: 200}
  - screenshot: read-with-ai
  # Scrolled to the end, the title and the top of the header card run up
  # under the toolbar and the reading banner and report bounds past the
  # window's top edge; the second band (above the top bar's text) excuses
  # only those.
  - scroll: {target: {role: label, label: Source document}, to: end}
  - assert_exists: {role: label, label: 1099 vendor}
  - assert_no_clipping:
      ignore:
        - {x: 212, y: 905, width: 10000, height: 200}
        - {x: 212, y: -200, width: 10000, height: 225}
  - screenshot: read-with-ai-panel-end
  - scroll: {target: {role: label, label: 1099 vendor}, to: start}
  - key: Alt+A
  - assert_state: {key: screen.read.unaccepted, equals: 0}
  - assert_not_exists: {role: button, label: Accept these values}
  - click: {label: "Account, line 1"}
  - key: Tab
  - assert_value: {target: {label: "Account, line 1"}, equals: "6210 · Equipment rental"}
  - click: {label: "Account, line 2"}
  - key: Tab
  - assert_value: {target: {label: "Account, line 2"}, equals: "6210 · Equipment rental"}
  - assert_state: {key: screen.read.ghosts.accepted, equals: 2}
  - key: Alt+N
  - assert_state: {key: screen.saved_count, equals: 4}
  - assert_state: {key: screen.read.filled, equals: false}
  # Void it again (Q-P13w): newest first by date, the sample's 11/04 bill,
  # then this one.
  - key: PageUp
  - key: PageUp
  - assert_state: {key: screen.mode, equals: edit}
  - assert_state: {key: screen.date, equals: "2026-11-03"}
  - assert_exists: {role: tab, label_contains: "INV-55871"}
  - command: edit.void_transaction
  - type: {text: Scenario cleanup, target: {role: text_input, label: Reason}}
  - click: {role: button, label: Void}
  - assert_state: {key: screen.last_action, equals: void}
  - assert_state: {key: screen.mode, equals: new}

  # --- 10. Reading switched off (AC3): no Read with AI, nothing sent, and
  # the bill is typed and saved by hand as always -----------------------------
  - command: edit.preferences
  - assert_state: {key: screen.screen, equals: preferences}
  - click: {role: button, label: AI suggestions}
  - click: {role: check_box, label: Read bills and receipts}
  - click: {role: button, label: Save}
  - assert_state: {key: screen.dirty, equals: false}
  - click: {role: tab, label_contains: "Enter Bill"}
  - assert_state: {key: screen.screen, equals: enter_bill}
  - click: {role: button, label: Clear}
  - type: {text: "assets/sample/docs/midwest_inv_55871.pdf", target: {role: text_input, label: File}}
  - click: {role: button, label: Attach file}
  - assert_state: {key: screen.attachments.draft_files, equals: 1}
  - assert_not_exists: {role: button, label: Read with AI}
  - assert_state: {key: screen.read.available, equals: false}
  - assert_state: {key: screen.read.requests, equals: 0}
  - type: {text: Midwest Equip, target: {role: text_input, label: Vendor}}
  - key: Tab
  - assert_state: {key: screen.prefill.source, equals: default}
  - click: {role: text_input, label: Date}
  - key: Ctrl+A
  - type: {text: "11/03/2026"}
  - key: Tab
  - type: {text: "INV-55902", target: {role: text_input, label: Ref. no.}}
  - type: {text: "42.00", target: {role: text_input, label: "Amount due ($)"}}
  - key: Tab
  - click: {role: grid_cell, label: "Amount, line 1"}
  - type: {text: "42.00"}
  - key: Tab
  - assert_state: {key: screen.totals, equals: balanced}
  - assert_not_exists: {label_contains: "Read from the document"}
  - screenshot: reading-off
  - key: Alt+N
  - assert_state: {key: screen.saved_count, equals: 5}
  - assert_state: {key: screen.read.requests, equals: 0}
  - key: PageUp
  - key: PageUp
  - assert_state: {key: screen.mode, equals: edit}
  - assert_exists: {role: tab, label_contains: "INV-55902"}
  - command: edit.void_transaction
  - type: {text: Scenario cleanup, target: {role: text_input, label: Reason}}
  - click: {role: button, label: Void}
  - assert_state: {key: screen.last_action, equals: void}

  # --- 11. Read document (A03, Q-A03l): the document is read on this
  # computer by the sandboxed worker, with AI reading still off. Values are
  # filled as read and wait for Accept; nothing goes to the engine and no
  # draft is made; checks are listed and change nothing; a file that can't
  # be read says so and the form keeps working --------------------------------
  - click: {role: button, label: Clear}
  - type: {text: "assets/sample/docs/midwest_inv_55871.pdf", target: {role: text_input, label: File}}
  - click: {role: button, label: Attach file}
  - assert_state: {key: screen.attachments.draft_files, equals: 1}
  - assert_not_exists: {role: button, label: Read with AI}
  - assert_state: {key: screen.read.local.requests, equals: 0}
  - click: {role: button, label: Read document}
  # The first read starts the worker: give it a moment beyond the retries.
  - wait: {ms: 1500}
  - assert_state: {key: screen.read.local.outcome, equals: read}
  - assert_state: {key: screen.read.local.requests, equals: 1}
  - assert_state: {key: screen.read.requests, equals: 0}
  - assert_state: {key: screen.attachments.draft_files, equals: 1}
  # No draft and no bill: the demo engine took no write (A03 S8).
  - assert_state: {key: screen.writes_since_read, equals: 0}
  - assert_state: {key: screen.read.filled_locally, equals: true}
  - assert_state: {key: screen.read.unaccepted, equals: 6}
  - assert_state: {key: screen.read.reconciled, equals: true}
  - assert_state: {key: screen.has_vendor, equals: true}
  - assert_state: {key: screen.date, equals: "2026-11-03"}
  - assert_value: {target: {role: text_input, label: Ref. no.}, equals: "INV-55871"}
  - assert_value: {target: {role: text_input, label: "Amount due ($)"}, equals: "1,480.00"}
  - assert_exists: {role: label, label_contains: "Filled from midwest_inv_55871.pdf"}
  - assert_exists: {role: label, label_contains: "Read from the document", index: 0}
  # 11/03 could be 3 November or 11 March: shown, not changed.
  - assert_exists: {role: label, label_contains: "could also be read day first"}
  - assert_state: {key: screen.read.ghosts.open, equals: 2}
  - key: Alt+S
  - assert_state: {key: screen.read.save_refused, equals: true}
  - assert_no_clipping:
      ignore:
        - {x: 212, y: 905, width: 10000, height: 200}
  - screenshot: read-document
  - key: Alt+A
  - assert_state: {key: screen.read.unaccepted, equals: 0}
  - assert_state: {key: screen.read.requests, equals: 0}
  - click: {role: button, label: Clear}
  # Figures that don't agree: listed, nothing fixed; an unknown vendor is
  # offered, never added.
  - type: {text: "fixtures/docs/bill_read_mismatch.pdf", target: {role: text_input, label: File}}
  - click: {role: button, label: Attach file}
  - assert_state: {key: screen.attachments.draft_files, equals: 1}
  - click: {role: button, label: Read document}
  # (Clear starts the new bill's reading state afresh.)
  - assert_state: {key: screen.read.local.requests, equals: 1}
  - assert_state: {key: screen.read.local.outcome, equals: read}
  - assert_state: {key: screen.read.reconciled, equals: false}
  - assert_state: {key: screen.read.unknown_vendor, equals: true}
  - assert_state: {key: screen.has_vendor, equals: false}
  - assert_value: {target: {role: text_input, label: "Amount due ($)"}, equals: "310.00"}
  - assert_value: {target: {role: grid_cell, label: "Amount, line 1"}, equals: "180.00"}
  - assert_value: {target: {role: grid_cell, label: "Amount, line 2"}, equals: "120.00"}
  - assert_state: {key: screen.writes_since_read, equals: 0}
  - assert_exists: {role: label, label_contains: "Check these on the document"}
  - assert_exists: {role: label, label_contains: "The lines add up to 300.00"}
  - assert_exists: {role: button, label: Add as a new vendor?}
  - assert_no_clipping:
      ignore:
        - {x: 212, y: 905, width: 10000, height: 200}
  - screenshot: read-document-checks
  - click: {role: button, label: Clear and type it myself}
  - assert_state: {key: screen.read.filled, equals: false}
  - click: {role: button, label: Clear}
  # A password-protected PDF can't be read: plain words, manual entry goes on.
  - type: {text: "fixtures/docs/encrypted.pdf", target: {role: text_input, label: File}}
  - click: {role: button, label: Attach file}
  - assert_state: {key: screen.attachments.draft_files, equals: 1}
  - click: {role: button, label: Read document}
  - assert_state: {key: screen.read.local.outcome, equals: protected}
  - assert_exists: {role: label, label_contains: "Couldn't read this document"}
  - assert_state: {key: screen.read.filled, equals: false}
  - type: {text: "INV-TYPED", target: {role: text_input, label: Ref. no.}}
  - assert_value: {target: {role: text_input, label: Ref. no.}, equals: "INV-TYPED"}
  - screenshot: read-document-failed
  - assert_state: {key: screen.read.requests, equals: 0}
  - click: {role: button, label: Clear}
  # A hostile PDF (broken objects, absurd counts and lengths): the worker
  # gives up on it alone, the form keeps working, nothing is written.
  - type: {text: "fixtures/docs/hostile_garbled.pdf", target: {role: text_input, label: File}}
  - click: {role: button, label: Attach file}
  - click: {role: button, label: Read document}
  - wait: {ms: 1500}
  - assert_exists: {role: label, label_contains: "Couldn't read this document"}
  - assert_state: {key: screen.read.filled, equals: false}
  - assert_state: {key: screen.writes_since_read, equals: 0}
  - type: {text: "INV-HAND", target: {role: text_input, label: Ref. no.}}
  - assert_value: {target: {role: text_input, label: Ref. no.}, equals: "INV-HAND"}
  - assert_state: {key: screen.read.requests, equals: 0}
  - click: {role: button, label: Clear}
  # The switch back on, so the next theme's run starts the same.
  - click: {role: tab, label: Preferences}
  - click: {role: check_box, label: Read bills and receipts}
  - click: {role: button, label: Save}
  - assert_state: {key: screen.dirty, equals: false}
  - command: file.close_window
  - click: {role: tab, label_contains: "Enter Bill"}
  - assert_state: {key: screen.screen, equals: enter_bill}
  - assert_no_clipping: {}
  # Minimum window (960 x 640): the side panel goes under the form.
  - resize: {width: 960, height: 640}
  - assert_exists: {role: text_input, label: "Amount due ($)"}
  - assert_no_clipping: {}
  - screenshot: enter-bill-960x640
  # 200% zoom on the minimum window (480 x 320 points): Bill / Vendor
  # credit moves under the title, the header card's fields stack inside the
  # card, nothing is drawn over anything. Ignored, as in forms-zoom: the tab
  # strip (it scrolls, with the » list, so a tab may sit left of the window)
  # and the bottom band, where the scrolled form runs under the actions and
  # the status bar.
  - set_zoom: {percent: 200}
  - assert_exists: {role: text_input, label: "Amount due ($)"}
  - assert_exists: {role: radio_button, label: Vendor credit}
  - assert_not_exists: {label_contains: "no longer here"}
  - screenshot: enter-bill-z200
  - assert_no_clipping: &zoomed
      ignore:
        - {x: -4000, y: 70, width: 8480, height: 40}
        - {x: 0, y: 230, width: 480, height: 110}
  # A taller window at 200% (600 x 500 points; resize is in points) shows
  # the stacked card whole: its fields stay inside it.
  - resize: {width: 600, height: 500}
  - assert_exists: {role: radio_button, label: Vendor credit}
  - screenshot: enter-bill-z200-card
  - assert_no_clipping:
      ignore:
        - {x: -4000, y: 70, width: 8480, height: 40}
        - {x: 0, y: 400, width: 600, height: 110}
  - set_zoom: {percent: 100}
  - resize: {width: 1440, height: 940}
  - command: file.close_window
  - assert_not_exists: {role: tab, label_contains: "Enter Bill"}

