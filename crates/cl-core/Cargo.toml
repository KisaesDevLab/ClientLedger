[package]
name = "cl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared ClientLedger value types: money, ids, dates, fiscal calendars, secrets, errors (no I/O)."

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", default-features = false, features = ["std"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
