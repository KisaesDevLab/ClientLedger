[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cl-model = { path = "../crates/cl-model" }
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
liblzma = "0.4.8"
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", default-features = false, features = ["full", "visit", "parsing", "proc-macro", "derive", "clone-impls"] }
