[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cl-model = { path = "../crates/cl-model" }
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
liblzma = "0.4.8"
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `cargo xtask gen-invoices` (A03 step 12, Q-A03e): synthetic bills and
# receipts as PDFs with embedded subset fonts and ToUnicode maps, and their
# "scanned" pictures (rendered with the pinned PDFium, then degraded). Font
# metrics through skrifa (already in the tree; ttf-parser is unmaintained,
# RUSTSEC-2026-0192).
# pdf-writer, subsetter and skrifa are workspace dependencies (also used by
# cl-print since P19). All MIT OR Apache-2.0.
pdf-writer.workspace = true
subsetter.workspace = true
skrifa.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
syn = { version = "3", default-features = false, features = ["full", "visit", "parsing", "proc-macro", "derive", "clone-impls"] }
