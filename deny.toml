# License allowlist and advisory policy (Q-07). Direct dependencies are held to
# the stricter MIT/Apache-2.0 rule by `cargo xtask licenses`.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Multiple major versions of the GUI stack are denied outright.
deny = [
    { crate = "egui", deny-multiple-versions = true },
    { crate = "eframe", deny-multiple-versions = true },
    { crate = "wgpu", deny-multiple-versions = true },
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
