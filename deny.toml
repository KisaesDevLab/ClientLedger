# License allowlist and advisory policy (Q-07). Direct dependencies are held to
# the stricter MIT/Apache-2.0 rule by `cargo xtask licenses`.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# ClientLedger's own crates (all `publish = false`) are under the VibeMyFirm
# Community License 1.0 (LICENSE.md, Q-336); the allowlist is for dependencies only.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Multiple major versions of the GUI stack are denied outright.
deny = [
    { crate = "egui", deny-multiple-versions = true },
    { crate = "eframe", deny-multiple-versions = true },
    { crate = "wgpu", deny-multiple-versions = true },
]

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # chrono is marked unmaintained (no fixed version, no known vulnerability).
    # It is used for dates and timestamps across the workspace and by
    # pdfium-render; replacing it is its own change. Revisit when a
    # successor is chosen (2026-11-17).
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no safe upgrade; replacement tracked separately" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
