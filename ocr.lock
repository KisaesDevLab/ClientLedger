# Pinned OCR sources for `cargo xtask ocr-build` (A03, Q-283, plan D1).
#
# Tesseract (Apache-2.0) and Leptonica (BSD-2-Clause style) are built from
# source with every optional dependency switched off (no image codecs, zlib,
# curl, libarchive, OpenMP, training tools or graphics), then a linkage check
# refuses any library that is not part of the operating system.
#
# Line format:  <source name> <sha256 of the downloaded file> <url>
#
# Tesseract publishes no source tarball, so its line is GitHub's archive of
# the tag (stable since 2023); Leptonica's is its own release asset (compare
# with the `digest` GitHub shows for the asset). Update the version lines and
# the hashes together.
tesseract = 5.5.3
leptonica = 1.87.0
