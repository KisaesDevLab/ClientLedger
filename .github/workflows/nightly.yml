name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CL_OFFLINE_TESTS: "1"
  # PostgreSQL-backed tests fail instead of skipping when the binaries are missing.
  CL_PG_REQUIRE: "1"

jobs:
  ci:
    name: nightly (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: actions/cache@v6
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL (hash-verified, the only networked step)
        run: cargo xtask pg-fetch
      - run: cargo xtask ci
