name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CL_OFFLINE_TESTS: "1"
  # PostgreSQL-backed tests fail instead of skipping when the binaries are missing.
  CL_PG_REQUIRE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push (Q-114).
  linux:
    name: ci (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL (hash-verified, the only networked step)
        run: cargo xtask pg-fetch
      - run: cargo xtask ci

  # Pull requests only: the other two platforms (Q-114).
  other-os:
    name: ci (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL (hash-verified, the only networked step)
        run: cargo xtask pg-fetch
      - run: cargo xtask ci

  # Gitleaks is MIT licensed; run the binary directly (no license key needed).
  secret-scan:
    name: secret scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan
        run: ./gitleaks detect --source . --redact --verbose

  # Report only until P05, then enforced at 80% line coverage (Q-116).
  coverage:
    name: coverage (report only)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL
        run: cargo xtask pg-fetch
      - name: Coverage summary
        # TODO(P05): add `--fail-under-lines 80` and make this job required.
        run: cargo llvm-cov --workspace --exclude xtask --summary-only

  # Engine single executable (P01): built on every OS we ship, smoke-tested
  # against a temporary PostgreSQL, uploaded for later jobs.
  engine:
    name: engine (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CL_SMOKE_REQUIRE: "1"
      CL_REQUIRE_ENGINE_EXE: "1"
      # The supervisor tests with the real engine and PostgreSQL fail instead of skipping (Q-P04i).
      CL_HOST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - name: Engine commit
        id: engine
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:engine)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/engine/.cache
          key: engine-${{ matrix.os }}-${{ steps.engine.outputs.commit }}-node24
      - name: PostgreSQL 16 for the smoke run (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-16
          echo "CL_SMOKE_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: PostgreSQL 16 for the smoke run (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          echo "CL_SMOKE_PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - name: Build engine executable and smoke test
        run: cargo xtask engine --smoke
      - name: Executable runs without Node on PATH
        run: cargo test -p xtask -- built_executable_runs_without_node_on_path
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL (hash-verified)
        run: cargo xtask pg-fetch
      - name: Supervisor with the real engine and PostgreSQL (cold and warm start budgets, restarts, no orphans)
        run: cargo test -p cl-host --test real_engine -- --test-threads=1 --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ runner.os }}-${{ runner.arch }}
          path: target/engine/*/
          if-no-files-found: error
