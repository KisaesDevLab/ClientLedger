name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CL_OFFLINE_TESTS: "1"
  # PostgreSQL-backed tests fail instead of skipping when the binaries are missing.
  CL_PG_REQUIRE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push (Q-114).
  linux:
    name: ci (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL (hash-verified, the only networked step)
        run: cargo xtask pg-fetch
      - uses: actions/cache@v4
        with:
          path: target/pdfium/.cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pdfium-binaries.lock') }}
      # PDF previews (P17): the viewer tests that need PDFium fail instead of
      # skipping when it is missing (CL_PDFIUM_REQUIRE below).
      - name: Fetch pinned PDFium (hash-verified)
        run: cargo xtask pdfium-fetch
      # Local document reading (A03): tesseract built from pinned source with
      # every optional dependency off (minutes, once per cache key), then the
      # pinned model data. Worker and host tests that need OCR fail instead of
      # skipping when it is missing (CL_OCR_REQUIRE below).
      - uses: actions/cache@v4
        with:
          path: |
            target/ocr
            !target/ocr/.work
            !target/ocr/.stage
          key: ocr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ocr.lock', 'xtask/src/ocr_build.rs') }}
      - name: Build pinned tesseract (linkage checked)
        run: cargo xtask ocr-build
      - name: Fetch pinned OCR models (hash-verified)
        run: cargo xtask ocr-models
      - run: cargo xtask ci
        env:
          CL_PDFIUM_REQUIRE: "1"
          CL_OCR_REQUIRE: "1"
      # Ledger grid frame time (P10): 200k rows in the real shell, optimised,
      # p95 budget with one retry. Not under llvm-cov.
      - name: Grid scroll benchmark
        run: cargo xtask grid-bench

  # The reading worker and tesseract reach no network (A03 plan step 22,
  # T16; security review M4): every reading-worker test, real PDFium and
  # tesseract included, runs under strace, and any socket beyond loopback
  # or a local socket fails the job. Everything is built first so cargo
  # and rustc are not traced. `cargo xtask docread-check` (in `ci`) is the
  # static half on every OS. Every push.
  docread-netcheck:
    name: docread-netcheck (ubuntu-22.04)
    runs-on: ubuntu-22.04
    env:
      CL_PDFIUM_REQUIRE: "1"
      CL_OCR_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - name: strace
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
      - uses: actions/cache@v4
        with:
          path: target/pdfium/.cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pdfium-binaries.lock') }}
      - name: Fetch pinned PDFium (hash-verified)
        run: cargo xtask pdfium-fetch
      - uses: actions/cache@v4
        with:
          path: |
            target/ocr
            !target/ocr/.work
            !target/ocr/.stage
          key: ocr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ocr.lock', 'xtask/src/ocr_build.rs') }}
      - name: Build pinned tesseract (linkage checked)
        run: cargo xtask ocr-build
      - name: Fetch pinned OCR models (hash-verified)
        run: cargo xtask ocr-models
      - name: Build the worker tests and the test worker (before tracing)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p xtask
          cargo build -p clientledger-docread --features test-support --target-dir target/docread-test
          cargo test -p cl-host --test docread_worker --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          exe=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "docread_worker" and .executable != null) | .executable' \
            "$RUNNER_TEMP/build.json" | head -n 1)
          test -x "$exe" || { echo "::error::no docread_worker test binary"; exit 1; }
          echo "DOCREAD_TESTS=$exe" >> "$GITHUB_ENV"
      - name: Reading worker tests under strace
        shell: bash
        run: |
          set -euo pipefail
          # The tests' own `cargo build` of the test worker is a no-op now;
          # offline so cargo can't look anything up either.
          CARGO_NET_OFFLINE=true strace -f -qq -o "$RUNNER_TEMP/net.log" \
            -e trace=execve,socket,connect,sendto,sendmsg \
            "$DOCREAD_TESTS" --test-threads=1
          ./target/debug/xtask docread-netcheck "$RUNNER_TEMP/net.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docread-netcheck-log
          path: ${{ runner.temp }}/net.log
          if-no-files-found: ignore

  # Pull requests only: the other two platforms (Q-114).
  other-os:
    name: ci (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL (hash-verified, the only networked step)
        run: cargo xtask pg-fetch
      - uses: actions/cache@v4
        with:
          path: target/pdfium/.cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pdfium-binaries.lock') }}
      # PDF previews (P17): the viewer tests that need PDFium fail instead of
      # skipping when it is missing (CL_PDFIUM_REQUIRE below).
      - name: Fetch pinned PDFium (hash-verified)
        run: cargo xtask pdfium-fetch
      # Local document reading (A03): tesseract built from pinned source with
      # every optional dependency off (minutes, once per cache key), then the
      # pinned model data. Worker and host tests that need OCR fail instead of
      # skipping when it is missing (CL_OCR_REQUIRE below).
      - uses: actions/cache@v4
        with:
          path: |
            target/ocr
            !target/ocr/.work
            !target/ocr/.stage
          key: ocr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ocr.lock', 'xtask/src/ocr_build.rs') }}
      - name: Build pinned tesseract (linkage checked)
        run: cargo xtask ocr-build
      - name: Fetch pinned OCR models (hash-verified)
        run: cargo xtask ocr-models
      - run: cargo xtask ci
        env:
          CL_PDFIUM_REQUIRE: "1"
          CL_OCR_REQUIRE: "1"

  # Local reading accuracy (A03 plan D6, Q-285): the synthetic set (24
  # layouts, 6 held out; pinned test fonts, never committed), read by the
  # normal worker built optimised, scored per field and path, gated at the
  # Q-285 minimums. Also prints the worker and tesseract memory and time
  # peaks for this OS (step 12a). Pull requests only (OCR of ~700 pages).
  docread-accuracy:
    name: docread accuracy (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/pdfium/.cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pdfium-binaries.lock') }}
      - name: Fetch pinned PDFium (hash-verified)
        run: cargo xtask pdfium-fetch
      - uses: actions/cache@v4
        with:
          path: |
            target/ocr
            !target/ocr/.work
            !target/ocr/.stage
          key: ocr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ocr.lock', 'xtask/src/ocr_build.rs') }}
      - name: Build pinned tesseract (linkage checked)
        run: cargo xtask ocr-build
      - name: Fetch pinned OCR models (hash-verified)
        run: cargo xtask ocr-models
      - uses: actions/cache@v4
        with:
          path: target/docread-fonts
          key: docread-fonts-${{ hashFiles('docread-fonts.lock') }}
      - name: Synthetic documents (pinned test fonts, hash-verified)
        run: cargo xtask gen-invoices --holdout
      - name: Reading accuracy against Q-285
        run: cargo xtask docread-accuracy --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docread-accuracy-${{ runner.os }}
          path: target/docread-accuracy/
          if-no-files-found: ignore

  # Control-channel scenarios (P07, P10): the demo app runs in a real window and
  # the shell and grid_demo scenarios drive it in light and dark. Linux runs on every push under
  # Xvfb with a software Vulkan driver; Windows and macOS run on pull requests.
  ui-check-linux:
    name: ui-check (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - name: Display and software graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libgl1
      - uses: actions/cache@v4
        with:
          path: target/pdfium/.cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pdfium-binaries.lock') }}
      - name: Fetch pinned PDFium (hash-verified)
        run: cargo xtask pdfium-fetch
      - name: Shell scenario under Xvfb
        run: xvfb-run -a -s "-screen 0 1600x1200x24" cargo xtask ui-check shell
      - name: Ledger grid scenario under Xvfb
        run: xvfb-run -a -s "-screen 0 1600x1200x24" cargo xtask ui-check grid_demo --no-build
      - name: Document viewer scenario under Xvfb
        run: xvfb-run -a -s "-screen 0 1600x1200x24" cargo xtask ui-check document-view --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-linux
          path: target/ui-check
          if-no-files-found: ignore

  ui-check-other:
    name: ui-check (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/pdfium/.cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pdfium-binaries.lock') }}
      - name: Fetch pinned PDFium (hash-verified)
        run: cargo xtask pdfium-fetch
      - name: Shell scenario
        run: cargo xtask ui-check shell
      - name: Ledger grid scenario
        run: cargo xtask ui-check grid_demo --no-build
      - name: Document viewer scenario
        run: cargo xtask ui-check document-view --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-${{ runner.os }}
          path: target/ui-check
          if-no-files-found: ignore

  # Gitleaks is MIT licensed; run the binary directly (no license key needed).
  secret-scan:
    name: secret scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan
        run: ./gitleaks detect --source . --redact --verbose

  # Enforced at 80% workspace line coverage since P05 (Q-116). xtask and generated
  # code are excluded. This job does NOT run the real-engine contract suites
  # (they need the engine submodule and run in the engine job), so the number
  # covers unit, stub and offline tests only.
  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL
        run: cargo xtask pg-fetch
      - uses: actions/cache@v4
        with:
          path: target/pdfium/.cache
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pdfium-binaries.lock') }}
      - name: Fetch pinned PDFium
        run: cargo xtask pdfium-fetch
      - uses: actions/cache@v4
        with:
          path: |
            target/ocr
            !target/ocr/.work
            !target/ocr/.stage
          key: ocr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ocr.lock', 'xtask/src/ocr_build.rs') }}
      - name: Build pinned tesseract (linkage checked)
        run: cargo xtask ocr-build
      - name: Fetch pinned OCR models (hash-verified)
        run: cargo xtask ocr-models
      - name: Coverage summary
        run: cargo llvm-cov --workspace --exclude xtask --summary-only --fail-under-lines 80
        env:
          CL_PDFIUM_REQUIRE: "1"
          CL_OCR_REQUIRE: "1"

  # Engine single executable (P01): built on every OS we ship, smoke-tested
  # against a temporary PostgreSQL, uploaded for later jobs.
  engine:
    name: engine (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CL_SMOKE_REQUIRE: "1"
      CL_REQUIRE_ENGINE_EXE: "1"
      # The supervisor tests with the real engine and PostgreSQL fail instead of skipping (Q-P04i).
      CL_HOST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - name: Engine commit
        id: engine
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:engine)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/engine/.cache
          key: engine-${{ matrix.os }}-${{ steps.engine.outputs.commit }}-node24
      - name: PostgreSQL 16 for the smoke run (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-16
          echo "CL_SMOKE_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: PostgreSQL 16 for the smoke run (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          echo "CL_SMOKE_PG_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - name: Build engine executable and smoke test
        run: cargo xtask engine --smoke
      - name: Executable runs without Node on PATH
        run: cargo test -p xtask -- built_executable_runs_without_node_on_path
      - uses: actions/cache@v4
        with:
          path: target/pg/.cache
          key: pg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pg-binaries.lock') }}
      - name: Fetch pinned PostgreSQL (hash-verified)
        run: cargo xtask pg-fetch
      - name: Supervisor with the real engine and PostgreSQL (cold and warm start budgets, restarts, no orphans)
        env:
          # Hosted runners are slower than the 15 s cold / 5 s warm product budgets
          # (macos-15-intel measured 14.1 s / 5.2 s). The override applies to CI only.
          # windows-latest measured 31.9 s cold (initdb and the first migration are slower there);
          # macos-15-intel went past 30 s after engine migration 0221 (2026-10-20), so it gets 60 s too.
          # The product budget is measured on reference hardware in P37.
          CL_HOST_BUDGET_SECS: ${{ (runner.os == 'Windows' || (runner.os == 'macOS' && runner.arch == 'X64')) && '60' || '30' }}
        run: cargo test -p cl-host --test real_engine -- --test-threads=1 --nocapture
      - name: Engine spec fixtures are current (needs the engine submodule)
        env:
          CL_API_REQUIRE: "1"
        run: cargo xtask api-spec --check
      - name: cl-api contract tests against the real engine and PostgreSQL
        env:
          # Fail instead of skipping when the engine, PostgreSQL or engine/ are missing.
          CL_API_REQUIRE: "1"
          # Capabilities the pinned engine has (Q-P05h): a missing one fails
          # instead of going PENDING. Pin a88337e3: engine PR-A, PR-B, U-18, U-90, U-91, U-93.
          CL_API_REQUIRE_CAPS: "ap-closing-v1,ap-edit-v1,bill-lines-v1,bill-terms-v1,bill-received-v1,bill-ocr-v2,idempotency-v1,idempotency-ap-v1,attachments-company-v1,intake-settings-v1"
          # Same hosted-runner override as the cl-host step above (cold start is
          # slower than the 15 s product budget on shared runners). The contract
          # harness has its own boot limit, CL_API_BOOT_BUDGET_SECS (default 90 s).
          CL_HOST_BUDGET_SECS: ${{ (runner.os == 'Windows' || (runner.os == 'macOS' && runner.arch == 'X64')) && '60' || '30' }}
        run: cargo test -p cl-api --test contract --test contract_offline --test intake_settings --test spec_fixtures
      - name: Practice company against the real engine (templates load, first catch-up)
        env:
          CL_API_REQUIRE: "1"
        run: cargo test -p cl-company --test practice_live -- --nocapture

      # Network-blocked run (plan B3, Linux only). The tests run as a dedicated
      # non-root user (initdb, pg_ctl and postgres refuse to run as root) whose
      # non-loopback traffic is rejected by an iptables/ip6tables owner-match
      # rule. Only that user is affected, so the runner agent keeps its
      # connection. Everything is downloaded and built BEFORE the rule goes in;
      # the test binaries are then run directly (not through cargo).
      - name: Build the contract test binaries (before the network is blocked)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cl-api --test contract --test contract_offline --test intake_settings --test network_probe \
            --no-run --message-format=json > "$RUNNER_TEMP/cl-api-build.json"
          for name in network_probe contract contract_offline intake_settings; do
            exe=$(jq -r --arg n "$name" \
              'select(.reason == "compiler-artifact" and .target.name == $n and .executable != null) | .executable' \
              "$RUNNER_TEMP/cl-api-build.json" | head -n 1)
            test -x "$exe" || { echo "::error::no test binary for $name"; exit 1; }
            echo "$name=$exe" >> "$RUNNER_TEMP/cl-api-exes.env"
          done
          cat "$RUNNER_TEMP/cl-api-exes.env"
      - name: Create the cltest user and block its network
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v iptables >/dev/null && command -v ip6tables >/dev/null || {
            echo "::error::iptables/ip6tables are not available on this runner"; exit 1; }
          sudo useradd --create-home --shell /usr/sbin/nologin cltest
          sudo -u cltest mkdir -p /home/cltest/tmp
          # cltest only reads the workspace (owned by the runner user): let it
          # traverse the path down to target/ and read the binaries, the engine
          # and PostgreSQL. It writes only under /home/cltest (TMPDIR), so its
          # data directories are owned by it. The one write into target/ (the
          # PENDING list) fails and is ignored by the harness.
          d="$GITHUB_WORKSPACE"
          while [ "$d" != "/" ]; do sudo chmod o+x "$d"; d=$(dirname "$d"); done
          sudo chmod o+rx "$GITHUB_WORKSPACE/target" "$GITHUB_WORKSPACE/target/debug" "$GITHUB_WORKSPACE/target/debug/deps"
          sudo chmod -R o+rX "$GITHUB_WORKSPACE/target/pg" "$GITHUB_WORKSPACE/target/engine"
          # shellcheck disable=SC1090
          . "$RUNNER_TEMP/cl-api-exes.env"
          sudo chmod o+rx "$network_probe" "$contract" "$contract_offline" "$intake_settings"
          # TCP gets a reset (the connect fails at once); everything else
          # an ICMP unreachable. Loopback stays open: the engine, PostgreSQL and
          # the client all talk over 127.0.0.1.
          for ipt in iptables ip6tables; do
            case "$ipt" in
              iptables) icmp=icmp-port-unreachable ;;
              ip6tables) icmp=icmp6-port-unreachable ;;
            esac
            sudo "$ipt" -I OUTPUT 1 -m owner --uid-owner cltest ! -o lo -j REJECT --reject-with "$icmp"
            sudo "$ipt" -I OUTPUT 1 -m owner --uid-owner cltest ! -o lo -p tcp -j REJECT --reject-with tcp-reset
            # DNS on any interface, including the local stub resolver
            # (systemd-resolved on 127.0.0.53, which would otherwise forward
            # cltest's lookups as another user).
            sudo "$ipt" -I OUTPUT 1 -m owner --uid-owner cltest -p udp --dport 53 -j REJECT --reject-with "$icmp"
            sudo "$ipt" -I OUTPUT 1 -m owner --uid-owner cltest -p tcp --dport 53 -j REJECT --reject-with tcp-reset
          done
          sudo iptables -S OUTPUT
          sudo ip6tables -S OUTPUT
      - name: cl-api contract tests as cltest with the network blocked
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          . "$RUNNER_TEMP/cl-api-exes.env"
          cd "$GITHUB_WORKSPACE"
          run_blocked() {
            sudo -u cltest env HOME=/home/cltest TMPDIR=/home/cltest/tmp PATH="$PATH" \
              CL_OFFLINE_TESTS=1 CL_NETWORK_BLOCKED=1 CL_API_REQUIRE=1 CL_PG_REQUIRE=1 \
              CL_HOST_REQUIRE=1 CL_HOST_BUDGET_SECS=30 "$@"
          }
          # The probe first: if it fails, the block is not working and the
          # results below would prove nothing.
          run_blocked "$network_probe" --nocapture 2>&1 | tee "$RUNNER_TEMP/network_probe.log"
          grep -q "network_probe: blocked OK" "$RUNNER_TEMP/network_probe.log"
          run_blocked "$contract"
          run_blocked "$contract_offline"
          run_blocked "$intake_settings"
      - name: Remove the network block and the cltest user
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          for ipt in iptables ip6tables; do
            case "$ipt" in
              iptables) icmp=icmp-port-unreachable ;;
              ip6tables) icmp=icmp6-port-unreachable ;;
            esac
            sudo "$ipt" -D OUTPUT -m owner --uid-owner cltest ! -o lo -p tcp -j REJECT --reject-with tcp-reset || true
            sudo "$ipt" -D OUTPUT -m owner --uid-owner cltest ! -o lo -j REJECT --reject-with "$icmp" || true
            sudo "$ipt" -D OUTPUT -m owner --uid-owner cltest -p udp --dport 53 -j REJECT --reject-with "$icmp" || true
            sudo "$ipt" -D OUTPUT -m owner --uid-owner cltest -p tcp --dport 53 -j REJECT --reject-with tcp-reset || true
          done
          sudo pkill -u cltest || true
          sudo userdel --remove cltest || true

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ runner.os }}-${{ runner.arch }}
          path: target/engine/*/
          if-no-files-found: error
