name: fuzz-check

# Weekly compile check of the cl-import cargo-fuzz targets (P25 review S12).
# The fuzz crate (crates/cl-import/fuzz) is outside the workspace, so the
# regular CI never builds it; this keeps it compiling. Running the fuzzers
# needs nightly and a sanitizer and is done by hand (`cargo +nightly fuzz run
# ofx` from crates/cl-import). No secrets; crates are fetched as in every
# other job.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-check:
    name: cargo check (cl-import fuzz targets)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/cl-import/fuzz
      - run: cargo check --manifest-path crates/cl-import/fuzz/Cargo.toml --bins
