# Pinned PDFium binaries for `cargo xtask pdfium-fetch` (P17, Q-13).
#
# Source: bblanchon/pdfium-binaries (https://github.com/bblanchon/pdfium-binaries,
# MIT packaging of the BSD-3-Clause / Apache-2.0 PDFium library), release
# `chromium/<version>`, the plain archives: no V8 (JavaScript), no XFA forms
# (args.gn inside each archive: pdf_enable_v8 = false, pdf_enable_xfa = false).
# Only the shared library, LICENSE and licenses/*.txt are unpacked.
#
# The version must match the `pdfium_<version>` API feature of pdfium-render in
# crates/cl-ui/Cargo.toml (a test checks it).
#
# Line format:  <target triple> <sha256 of the downloaded file> <url>
# Targets are the directory names under target/pdfium/. Update the version and
# all four hashes together, and compare each hash with the `digest` GitHub
# publishes for the release asset (api.github.com/repos/bblanchon/pdfium-binaries/
# releases/tags/chromium%2F<version>).
