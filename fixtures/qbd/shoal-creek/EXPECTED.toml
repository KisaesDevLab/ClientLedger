# Shoal Creek Landscaping: a synthetic QuickBooks Desktop export set (P31).
# Every value below was worked out by hand from the files in this folder,
# never read from the engine. Amounts are exact decimal strings; account
# balances are signed, debit positive. tests/imports_fixtures.rs re-sums the
# files in rust_decimal and checks them against these values.

[company]
name = "Shoal Creek Landscaping"
conversion_date = "2026-10-27"
fiscal_year_start_month = "1"
# Q-142 "two years plus opening balances": the first day of the fiscal year
# two years before the conversion's fiscal year, and the day before it.
history_from_two_years = "2024-01-01"
opening_tb_date = "2023-12-31"

[files]
account-list = "coa"
customer-list = "contacts:customer"
vendor-list = "contacts:vendor"
