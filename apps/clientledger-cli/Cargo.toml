[package]
name = "clientledger-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cl-automation = { path = "../../crates/cl-automation" }
cl-core = { path = "../../crates/cl-core" }
# A03 step 19: `read` prints the worker's reading (types only, no worker parsers).
cl-docread = { path = "../../crates/cl-docread" }
cl-host = { path = "../../crates/cl-host" }
# P29 WP9 `qa seed`: the QA company through real engine routes. Only in a
# build with the `qa-seed` feature (`cargo xtask qa-company`), never in a
# release build (security review minor 9: it holds fixed QA passwords).
cl-api = { path = "../../crates/cl-api", optional = true }
cl-company = { path = "../../crates/cl-company", optional = true }
cl-model = { path = "../../crates/cl-model", optional = true }
cl-pg = { path = "../../crates/cl-pg", optional = true }
cl-settings = { path = "../../crates/cl-settings", optional = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time"], optional = true }
# `read`: the owner's today. MIT OR Apache-2.0 (already used by cl-ui).
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ctrlc = "3.5.2"
serde_json = "1.0.154"

[features]
# `clientledger-cli qa seed` (developer QA only; `cargo xtask qa-company` turns it on).
qa-seed = ["dep:cl-api", "dep:cl-company", "dep:cl-model", "dep:cl-pg", "dep:cl-settings", "dep:tokio"]
