[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/KisaesDevLab/ClientLedger"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# `cargo xtask grid-bench`: optimised, but with debug assertions on, because
# cl-ui's dev-dependencies switch on cl-api's `test-support`, which refuses
# to build without them (a guard against test hooks in release builds).
[profile.grid-bench]
inherits = "release"
debug-assertions = true

# `cargo xtask docread-accuracy` and `docread-bench` (A03, plan D6): the
# reading worker and cl-host's accuracy harness, optimised, with debug
# assertions on so test-support builds (fault-injection worker, cl-api
# test hooks) compile under it.
[profile.docread-bench]
inherits = "release"
debug-assertions = true
